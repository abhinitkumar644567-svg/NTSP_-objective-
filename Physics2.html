        { q: "61. आवेशित चालक की ऊर्जा होती है :", options: ["(A) E = 1/2 C V", "(B) E = 1/2 C V²", "(C) E = 1/2 C² V", "(D) E = C V"], ans: 1 },
        { q: "62. यदि समान धारिता C₁ के n संधारित्र समान्तर क्रम में जोड़े जाएँ तो तुल्य धारिता होगी :", options: ["(A) C = n/C₁", "(B) C = C₁/n", "(C) C = nC₁", "(D) C = n²C₁"], ans: 2 },
        { q: "63. वायु के लिए परावैद्युत सामर्थ्य होता है :", options: ["(A) 3 × 10⁶ V m⁻¹", "(B) 4 × 10⁶ V m⁻¹", "(C) 5 × 10⁶ V m⁻¹", "(D) 10⁶ V m⁻¹"], ans: 0 },
        { q: "64. निम्नलिखित में कौन संबंध द्रव्यमान और ऊर्जा के लिए सही है?", options: ["(A) m = E", "(B) m² = E", "(C) mc² = E", "(D) m = √(E/2)"], ans: 2 },
        { q: "65. दशमिक संख्या (8)₁₀ की द्विआधारी संख्या होती है :", options: ["(A) (1000)₂", "(B) (1001)₂", "(C) (111)₂", "(D) (110)₂"], ans: 0 },
        { q: "66. NAND गेट का संकेत होता है :", options: ["(A) AND", "(B) OR", "(C) NOT", "(D) NAND (D-आकार + बबल)"], ans: 3 },
        { q: "67. अर्द्ध-आयु काल T_1/2 एवं क्षय नियतांक (λ) में संबंध होता है :", options: ["(A) T_1/2 = 0.693 / λ", "(B) T_1/2 = λ / 0.693", "(C) T_1/2 = 0.693 λ", "(D) T_1/2 = 0.693 λ²"], ans: 0 },
        { q: "68. निम्नलिखित में कौन α-कण के लिए सही है?", options: ["(A) इलेक्ट्रॉन", "(B) विद्युत-चुम्बकीय विकिरण", "(C) हीलियम नाभिक", "(D) हाइड्रोजन नाभिक"], ans: 2 },
        { q: "69. निम्नलिखित में कौन समीकरण सही है?", options: ["(A) ²³⁸U → ²³⁴U + ⁴He", "(B) ²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He", "(C) ²³⁸U → ²³⁴Th + ⁴He", "(D) ²³⁸U → ²³²Th + ⁴He"], ans: 1 },
        { q: "70. निम्न में कौन बायो-सावर्ट नियम के सदिश समीकरण का सही रूप है?", options: ["(A) dB = (μ₀/4π) · I(dl × r̂)/r²", "(B) dB = (μ₀/4π) · I(dl)/r²", "(C) dB = (μ₀/4π) · I(dl × r⃗)/r³", "(D) dB = (μ₀/4π) · I r⃗/r²"], ans: 2 }
    ];

    const quizContainer = document.getElementById('quiz-container');

    questions.forEach((qObj, qIndex) => {
        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        
        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerHTML = qObj.q;
        qBox.appendChild(qText);
        
        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';
        
        const feedbackBox = document.createElement('div');
        feedbackBox.className = 'feedback';
        
        qObj.options.forEach((opt, optIndex) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            
            btn.onclick = () => {
                const allBtns = optionsList.querySelectorAll('.option-btn');
                allBtns.forEach(b => b.disabled = true);
                
                if (optIndex === qObj.ans) {
                    btn.classList.add('correct');
                    feedbackBox.innerHTML = "✅ बिल्कुल सही जवाब!";
                    feedbackBox.className = 'feedback feedback-correct';
                } else {
                    btn.classList.add('incorrect');
                    allBtns[qObj.ans].classList.add('correct');
                    feedbackBox.innerHTML = "❌ गलत जवाब। सही उत्तर: " + qObj.options[qObj.ans] + " है।";
                    feedbackBox.className = 'feedback feedback-wrong';
                }
                feedbackBox.style.display = 'block';
            };
            
            const li = document.createElement('li');
            li.appendChild(btn);
            optionsList.appendChild(li);
        });
        
        qBox.appendChild(optionsList);
        qBox.appendChild(feedbackBox);
        quizContainer.appendChild(qBox);
    });
</script>

</body>
</html>
