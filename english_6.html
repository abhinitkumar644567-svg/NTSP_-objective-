<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENGLISH 12th (2026) - 100 Objective Test</title>
    <style>
        /* आकाशी (Sky Blue) और लाल (Red) कलर ग्रेडिंग - No Pure White */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #b3e5fc 0%, #ffcdd2 100%);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            color: #1a0000;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #e1f5fe;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(183, 28, 28, 0.2);
            border: 2px solid #ef5350;
        }
        h1 {
            text-align: center;
            font-size: 26px;
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 3px dashed #d32f2f;
            color: #b71c1c;
            font-weight: 900;
        }
        .info-bar {
            text-align: center;
            font-size: 16px;
            color: #fff;
            background: linear-gradient(to right, #0288d1, #d32f2f);
            margin-bottom: 25px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3);
        }
        /* --- टाइमर का डिज़ाइन --- */
        .timer-box {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(183, 28, 28, 0.5);
            z-index: 1000;
            letter-spacing: 1px;
            border: 2px solid #ffcdd2;
        }
        @media (max-width: 600px) {
            .timer-box {
                top: 10px;
                right: 50%;
                transform: translateX(50%);
                font-size: 16px;
                padding: 10px 20px;
            }
            .container { margin-top: 50px; }
        }
        .q-box {
            margin-bottom: 20px;
            padding: 18px;
            border-left: 5px solid #d32f2f;
            border-radius: 8px;
            background: #b3e5fc;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }
        .q-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(211, 47, 47, 0.2);
        }
        .q-text {
            font-size: 17px;
            font-weight: bold;
            color: #01579b;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .opt-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 18px;
            margin-bottom: 8px;
            font-size: 16px;
            background-color: #e1f5fe;
            border: 1px solid #0288d1;
            color: #000;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .opt-btn:hover:not(:disabled) {
            background-color: #81d4fa;
            border-color: #d32f2f;
            transform: translateX(4px);
        }
        .opt-btn:disabled {
            cursor: not-allowed;
            opacity: 0.95;
        }
        .correct {
            background: linear-gradient(to right, #0288d1, #03a9f4) !important;
            border-color: #01579b !important;
            color: #fff !important;
            font-weight: bold;
        }
        .incorrect {
            background: linear-gradient(to right, #d32f2f, #f44336) !important;
            border-color: #b71c1c !important;
            color: #fff !important;
            font-weight: bold;
        }
        .feedback {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div id="timer" class="timer-box">⏱️ 01:00:00</div>

<div class="container">
    <h1>ENGLISH (अंग्रेजी) - XII (100 Marks) - 2026 (A)</h1>
    <div class="info-bar">Total Questions: 100 | Time: 1 Hour | Choose the correct option</div>
    <div id="quiz-container"></div>
</div>

<script>
    // 1 Hour Timer
    let timeInSeconds = 3600; 
    const timerElement = document.getElementById('timer');

    const countdown = setInterval(() => {

            timerElement.innerHTML = "⏳ Time Up!";
            timerElement.style.background = "linear-gradient(135deg, #b71c1c, #d32f2f)";
            document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
            alert("Time is up! You can no longer answer.");
            return;
        }
        timeInSeconds--;
        let h = Math.floor(timeInSeconds / 3600), m = Math.floor((timeInSeconds % 3600) / 60), s = timeInSeconds % 60;
        timerElement.innerHTML = `⏱️ ${h<10?'0'+h:h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
    }, 1000); 

    // Compressed Array of 100 Questions (From 2026 A English Images)

{q:"68. Every newspaper lives in a precarious :",o:["(A) battle","(B) imbalance","(C) balance","(D) struggle"],a:2},

    ];

    const quizContainer = document.getElementById('quiz-container');

    q.forEach((qObj) => {
        const qBox = document.createElement('div');
        qBox.className = 'q-box';
        
        const qText = document.createElement('div');
        qText.className = 'q-text';
        qText.innerHTML = qObj.q;
        qBox.appendChild(qText);
        
        const feedbackBox = document.createElement('div');
        feedbackBox.className = 'feedback';
        
        const btnGroup = document.createElement('div');
        
        qObj.o.forEach((opt, optIndex) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = opt;
            
            btn.onclick = () => {
                const allBtns = btnGroup.querySelectorAll('.opt-btn');
                allBtns.forEach(b => b.disabled = true);
                
                if (optIndex === qObj.a) {
                    btn.classList.add('correct');
                    feedbackBox.innerHTML = "✅ Correct Answer!";
                    feedbackBox.style.color = "#01579b";
                    feedbackBox.style.background = "#e1f5fe";
                    feedbackBox.style.border = "1px solid #0288d1";
                } else {
                    btn.classList.add('incorrect');
                    allBtns[qObj.a].classList.add('correct');
                    
                    const correctText = qObj.o[qObj.a].substring(0,3);
                    feedbackBox.innerHTML = "❌ Wrong Answer! Correct: " + correctText + ")";
                    feedbackBox.style.color = "#b71c1c";
                    feedbackBox.style.background = "#ffcdd2";
                    feedbackBox.style.border = "1px solid #d32f2f";
                }
                feedbackBox.style.display = 'block';
            };
            btnGroup.appendChild(btn);
        });
        
        qBox.appendChild(btnGroup);
        qBox.appendChild(feedbackBox);
        quizContainer.appendChild(qBox);
    });
</script>

</body>
</html>
