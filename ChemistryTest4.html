        { q: "56. निम्नलिखित में कौन कीटोहेक्सोज है ?", options: ["(A) ग्लूकोस", "(B) फ्रक्टोज", "(C) सुक्रोज", "(D) स्टार्च"], ans: 1 },
        { q: "57. निम्नलिखित में कौन प्रथम कोटि की अभिक्रिया नहीं है ?", options: ["(A) CH3COOC2H5 + NaOH →", "(B) 2H2O2 → 2H2O + O2", "(C) 2N2O5 → 4NO2 + O2", "(D) इनमें से कोई नहीं"], ans: 0 },
        { q: "58. किसी अभिक्रिया का वेग समीकरण: दर = k[A]^x[B]^y है, तो अभिक्रिया की कोटि है :", options: ["(A) x + y", "(B) x - y", "(C) x / y", "(D) x * y"], ans: 0 },
        { q: "59. किसी अभिक्रिया का वेग स्थिरांक निर्भर करता है :", options: ["(A) ताप पर", "(B) दाब पर", "(C) सांद्रता पर", "(D) समय पर"], ans: 0 },
        { q: "60. फ्रेंडलिच के अधिशोषण समताप के अनुसार :", options: ["(A) x/m = kp^(1/n)", "(B) x/m = kp^n", "(C) x/m = k/p", "(D) x/m = k"], ans: 0 },
        { q: "61. दूध है :", options: ["(A) जल में परिक्षिप्त वसा", "(B) वसा में परिक्षिप्त जल", "(C) तेल में परिक्षिप्त जल", "(D) जल में परिक्षिप्त जल"], ans: 0 },
        { q: "62. निम्नलिखित में कौन लायोफिलिक कोलाइड है ?", options: ["(A) दूध", "(B) गोंद", "(C) कुहासा", "(D) रक्त"], ans: 1 },
        { q: "63. हैबर विधि द्वारा अमोनिया के उत्पादन में प्रयुक्त उत्प्रेरक है :", options: ["(A) Fe + Mo", "(B) Pt", "(C) V2O5", "(D) Ni"], ans: 0 },
        { q: "64. निम्नलिखित में कौन ऑर्थोफॉस्फोरिक अम्ल का अणुसूत्र है ?", options: ["(A) H3PO4", "(B) H3PO3", "(C) H3PO2", "(D) H4P2O7"], ans: 0 },
        { q: "65. XeF4 की संरचना होती है :", options: ["(A) चतुष्फलकीय", "(B) वर्ग समतलीय", "(C) पिरामिडल", "(D) अष्टफलकीय"], ans: 1 },
        { q: "66. निम्नलिखित में कौन हैलोजन धनात्मक ऑक्सीकरण अवस्था प्रदर्शित नहीं करता है ?", options: ["(A) I", "(B) Br", "(C) Cl", "(D) F"], ans: 3 },
        { q: "67. निम्नलिखित में किसका बन्ध कोण सबसे छोटा है ?", options: ["(A) H2O", "(B) H2S", "(C) H2Se", "(D) H2Te"], ans: 3 },
        { q: "68. निम्नलिखित में किसमें अयुग्मित इलेक्ट्रॉनों की संख्या अधिकतम है ?", options: ["(A) Mg2+", "(B) Ti3+", "(C) V3+", "(D) Fe3+"], ans: 3 },
        { q: "69. क्रोमियम की अधिकतम ऑक्सीकरण अवस्था है :", options: ["(A) +2", "(B) +3", "(C) +4", "(D) +6"], ans: 3 },
        { q: "70. Cu2+ (Z = 29) आयन में अयुग्मित इलेक्ट्रॉन की संख्या है :", options: ["(A) 0", "(B) 1", "(C) 2", "(D) 3"], ans: 1 }
    ];

    const quizContainer = document.getElementById('quiz-container');

    questions.forEach((qObj, qIndex) => {
        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        
        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerHTML = qObj.q;
        qBox.appendChild(qText);
        
        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';
        
        const feedbackBox = document.createElement('div');
        feedbackBox.className = 'feedback';
        
        qObj.options.forEach((opt, optIndex) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            
            btn.onclick = () => {
                // एक बार क्लिक करने के बाद सभी बटन डिसेबल कर दें
                const allBtns = optionsList.querySelectorAll('.option-btn');
                allBtns.forEach(b => b.disabled = true);
                
                // सही या गलत की जांच
                if (optIndex === qObj.ans) {
                    btn.classList.add('correct');
                    feedbackBox.innerHTML = "✅ बिल्कुल सही जवाब!";
                    feedbackBox.className = 'feedback feedback-correct';
                } else {
                    btn.classList.add('incorrect');
                    // सही उत्तर को हरा दिखाएं
                    allBtns[qObj.ans].classList.add('correct');
                    feedbackBox.innerHTML = "❌ गलत जवाब। सही उत्तर: " + qObj.options[qObj.ans] + " है।";
                    feedbackBox.className = 'feedback feedback-wrong';
                }
                feedbackBox.style.display = 'block';
            };
            
            const li = document.createElement('li');
            li.appendChild(btn);
            optionsList.appendChild(li);
        });
        
        qBox.appendChild(optionsList);
        qBox.appendChild(feedbackBox);
        quizContainer.appendChild(qBox);
    });
</script>

</body>
</html>
