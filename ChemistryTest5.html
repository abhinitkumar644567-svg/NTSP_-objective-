        { q: "59. अणुसूत्र C4H10O के कितने समावयवी ऐल्कोहॉल हैं ?", options: ["(A) 2", "(B) 4", "(C) 7", "(D) 8"], ans: 1 },
        { q: "60. K2Cr2O7 के द्वारा ऑक्सीकरण से मेथिल ऐल्कोहॉल देता है :", options: ["(A) CH3COCH3", "(B) CH3CHO", "(C) HCOOH", "(D) CH3COOH"], ans: 2 },
        { q: "61. डाईएथिल ईथर का दवा के रूप में उपयोग होता है :", options: ["(A) दर्द निवारक के रूप में", "(B) निद्रा की दवा में", "(C) पूतिरोधी के रूप में", "(D) निश्चेतक के रूप में"], ans: 3 },
        { q: "62. कार्बोनिल यौगिकों का सामान्य सूत्र है :", options: ["(A) CnH2nO", "(B) CnH2nO", "(C) CnH2n+2O", "(D) इनमें से कोई नहीं"], ans: 0 },
        { q: "63. कमरे के तापक्रम पर फार्मल्डिहाईड है :", options: ["(A) गैस", "(B) द्रव", "(C) ठोस", "(D) इनमें से कोई नहीं"], ans: 0 },
        { q: "64. निम्नलिखित में कौन अधिशोषण बहुआण्विक स्तर बनाता है ?", options: ["(A) भौतिक अधिशोषण", "(B) रासायनिक अधिशोषण", "(C) (A) और (B) दोनों", "(D) इनमें से कोई नहीं"], ans: 0 },
        { q: "65. अयस्कों में उपस्थित अशुद्धियों को कहा जाता है :", options: ["(A) फ्लक्स", "(B) गैंग", "(C) मिश्रधातु", "(D) धातुमल"], ans: 1 },
        { q: "66. प्रगलन विधि में धातु के ऑक्साइड के अपचयन में प्रयुक्त होता है :", options: ["(A) Al", "(B) C", "(C) Mg", "(D) S"], ans: 1 },
        { q: "67. ल्यूटेशियम (Lu) है :", options: ["(A) एक संक्रमण तत्त्व", "(B) एक लैंथेनाइड", "(C) एक ऐक्टिनाइड", "(D) एक p-ब्लॉक का तत्त्व"], ans: 1 },
        { q: "68. 3d संक्रमण श्रेणी में किस परमाणु संख्या वाले तत्व होते हैं ?", options: ["(A) 22 से 30", "(B) 21 से 30", "(C) 21 से 31", "(D) 21 से 29"], ans: 1 },
        { q: "69. निम्नलिखित समीकरण द्वारा व्यक्त धातु के शुद्धिकरण की विधि को कहा जाता है: Ti + 2I2 → TiI4 → Ti + 2I2", options: ["(A) क्यूपलेशन", "(B) पोलिंग", "(C) वैन आर्केल", "(D) प्रक्षेत्र शोधन"], ans: 2 },
        { q: "70. निम्नलिखित में कौन धातु विद्युत-अपघटन से प्राप्त नहीं होता है ?", options: ["(A) Na", "(B) Mg", "(C) Al", "(D) Fe"], ans: 3 }
    ];

    const quizContainer = document.getElementById('quiz-container');

    questions.forEach((qObj, qIndex) => {
        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        
        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerHTML = qObj.q;
        qBox.appendChild(qText);
        
        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';
        
        const feedbackBox = document.createElement('div');
        feedbackBox.className = 'feedback';
        
        qObj.options.forEach((opt, optIndex) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            
            btn.onclick = () => {
                const allBtns = optionsList.querySelectorAll('.option-btn');
                allBtns.forEach(b => b.disabled = true);
                
                if (optIndex === qObj.ans) {
                    btn.classList.add('correct');
                    feedbackBox.innerHTML = "✅ बिल्कुल सही जवाब!";
                    feedbackBox.className = 'feedback feedback-correct';
                } else {
                    btn.classList.add('incorrect');
                    allBtns[qObj.ans].classList.add('correct');
                    feedbackBox.innerHTML = "❌ गलत जवाब। सही उत्तर: " + qObj.options[qObj.ans] + " है।";
                    feedbackBox.className = 'feedback feedback-wrong';
                }
                feedbackBox.style.display = 'block';
            };
            
            const li = document.createElement('li');
            li.appendChild(btn);
            optionsList.appendChild(li);
        });
        
        qBox.appendChild(optionsList);
        qBox.appendChild(feedbackBox);
        quizContainer.appendChild(qBox);
    });
</script>

</body>
</html>
