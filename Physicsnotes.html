<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTSP 12th Physics </title>
    <style>
        :root {
            /* Light Theme */
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
            --primary: #3498db;
            --secondary: #2ecc71;
            --danger: #e74c3c;
            --nav-bg: #2c3e50;
            --nav-text: #ffffff;
            --border: #e0e0e0;
            --shadow: rgba(0, 0, 0, 0.1);
        }
        [data-theme="dark"] {
            /* Dark Theme */
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --primary: #4dabf7;
            --secondary: #69db7c;
            --danger: #ff6b6b;
            --nav-bg: #000000;
            --nav-text: #ffffff;
            --border: #333333;
            --shadow: rgba(0, 0, 0, 0.5);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; }
        
        /* Navigation */
        nav { background-color: var(--nav-bg); color: var(--nav-text); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px var(--shadow); }
        .logo { font-size: 1.2rem; font-weight: bold; }
        .nav-buttons button { background: none; border: none; color: white; cursor: pointer; margin-left: 15px; font-size: 1rem; }
        .theme-btn { background: var(--primary); padding: 5px 10px; border-radius: 5px; font-weight: bold; border: none; cursor: pointer; color: white; }

        /* App Container */
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .hidden { display: none !important; }

        /* Dashboard (Chapter Grid) */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background-color: var(--card-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px var(--shadow); border: 1px solid var(--border); cursor: pointer; transition: transform 0.2s; }
        .card:active { transform: scale(0.98); }
        .card h3 { font-size: 1.1rem; margin-bottom: 10px; color: var(--primary); }
        .progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: var(--secondary); width: 0%; }

        /* Filters & Controls */
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; background: var(--card-bg); padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px var(--shadow); }
        input[type="text"], select, button.btn { padding: 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-color); color: var(--text-color); outline: none; }
        button.btn { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        button.btn-sec { background: var(--nav-bg); }

        /* Question List */
        .q-box { background: var(--card-bg); margin-bottom: 15px; padding: 20px; border-radius: 10px; border: 1px solid var(--border); box-shadow: 0 2px 4px var(--shadow); }
        .q-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--primary); margin-bottom: 10px; font-weight: bold; }
        .q-text { font-size: 1.1rem; margin-bottom: 15px; font-weight: 600; line-height: 1.4; }
        .options { list-style: none; margin-bottom: 15px; }
        .options li { padding: 8px 10px; background: var(--bg-color); margin-bottom: 5px; border-radius: 5px; border: 1px solid var(--border); }
        .ans-box { display: none; padding: 10px; background: rgba(46, 204, 113, 0.1); border-left: 4px solid var(--secondary); margin-top: 10px; border-radius: 4px; }
        .badge { background: #f39c12; color: #ffffff; padding: 3px 8px; border-radius: 12px; font-size: 0.7rem; }

        /* Test Interface */
        .test-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 15px; background: var(--card-bg); border-radius: 10px; }
        .timer { font-size: 1.2rem; font-weight: bold; color: var(--danger); }
        .test-option { padding: 12px; border: 2px solid var(--border); border-radius: 8px; margin-bottom: 10px; cursor: pointer; background: var(--bg-color); }
        .test-option.selected { border-color: var(--primary); background: rgba(139, 208, 255, 0.9215686274509803); }
        .test-option.correct-reveal { border-color: var(--secondary); background: rgba(46, 204, 113, 0.2); }
        .test-option.wrong-reveal { border-color: var(--danger); background: rgba(231, 76, 60, 0.2); }
        .test-nav { display: flex; justify-content: space-between; margin-top: 20px; }

        /* Results */
        .result-card { text-align: center; background: var(--card-bg); padding: 30px; border-radius: 10px; }
        .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 8px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; margin: 0 auto 20px; }
    </style>  
</head>
<body>
    <nav>
        <div class="logo"></div>
        <div class="nav-buttons">
            <button onclick="showSection('qbank_view'); renderAllQuestions();">📂</button>
            <button class="theme-btn" onclick="toggleTheme()">🌙</button>
        </div>
    </nav>

    <div class="container">
        <!-- 1. DASHBOARD -->
        <main id="dashboard">
            <h2>अध्याय सूची</h2>
            <div class="controls" style="margin-top: 15px;">
                <button class="btn" onclick="startFullMockTest()">📝 Mock Test (50 Q)</button>
            </div>
            <div class="grid" id="chapterGrid"></div>
        </main>

        <!-- 2. QUESTION BANK VIEW -->
        <main id="qbank_view" class="hidden">
            <div class="controls">
                <input type="text" id="searchInput" placeholder="प्रश्न खोजें..." onkeyup="filterQuestions()">
                <select id="typeFilter" onchange="filterQuestions()">
                    <option value="All">सभी प्रकार</option>
                    <option value="PYQ">केवल PYQ</option>
                    <option value="Modified PYQ">Modified PYQ</option>
                    <option value="NCERT">NCERT / महत्वपूर्ण</option>
                </select>
                <button class="btn" onclick="toggleAllAnswers()">👁</button>
            </div>
            <h3 id="qbank_title" style="margin-bottom: 15px;">All Questions</h3>
            <div id="qList"></div>
        </main>

        <!-- 3. TEST INTERFACE -->
        <main id="test_view" class="hidden">
            <div class="test-header">
                <div>प्रश्न: <span id="t_current">1</span> / <span id="t_total">35</span></div>
                <div class="timer" id="timer_display">10:00</div>
            </div>
            <div class="q-box">
                <div class="q-header"><span id="t_type" class="badge">PYQ</span></div>
                <div class="q-text" id="t_question">Question Text Here?</div>
                <div id="t_options"></div>
            </div>
            <div class="test-nav">
                <button class="btn btn-sec" onclick="prevTestQuestion()">Previous</button>
                <button class="btn" id="t_submit_btn" onclick="nextTestQuestion()">Next</button>
            </div>
        </main>

        <!-- 4. RESULT INTERFACE -->
        <main id="result_view" class="hidden">
            <div class="result-card">
                <h2>टेस्ट परिणाम</h2>
                <div class="score-circle" id="r_score">0%</div>
                <p>कुल प्रश्न: <span id="r_total">0</span></p>
                <p>सही उत्तर: <span id="r_correct" style="color:var(--secondary); font-weight:bold;">0</span></p>
                <p>गलत/छूटे: <span id="r_wrong" style="color:var(--danger); font-weight:bold;">0</span></p>
                <br>
                <button class="btn" onclick="showSection('dashboard')">Home पर जाएँ</button>
            </div>
        </main>
    </div>

    { id: 31, ch: 1, text: "इलेक्ट्रॉन वोल्ट (eV) द्वारा मापा जाता है:", options: ["आवेश", "विभवांतर", "धारा", "ऊर्जा"], ans: 3, type: "PYQ", year: "2022" },

    { id: 37, ch: 1, text: "वान डी ग्राफ (Van de Graaff) जनरेटर का उपयोग होता है:", options: ["उच्च धारा उत्पन्न करने में", "उच्च वोल्टता उत्पन्न करने में", "निम्न वोल्टता उत्पन्न करने में", "विद्युत चुम्बकीय तरंग उत्पन्न करने में"], ans: 1, type: "PYQ", year: "2022" },
    { id: 38, ch: 1, text: "जब संधारित्र की प्लेटों के बीच कोई परावैद्युत माध्यम रखा जाता है, तो उसकी धारिता:", options: ["बढ़ती है", "घटती है", "अपरिवर्तित रहती है", "शून्य हो जाती है"], ans: 0, type: "PYQ", year: "2018" },

    { id: 40, ch: 1, text: "आवेशित संधारित्र की पट्टियों के बीच लगने वाला बल होता है:", options: ["Q / (2A&epsilon;<sub>0</sub>)", "Q<sup>2</sup> / (2A&epsilon;<sub>0</sub>)", "Q<sup>2</sup> / (A&epsilon;<sub>0</sub>)", "Q / (A&epsilon;<sub>0</sub>)"], ans: 1, type: "PYQ", year: "2021" },

    { id: 46, ch: 1, text: "विद्युत क्षेत्र E का ऊर्जा घनत्व (Energy density) होता है:", options: ["1/2 &epsilon;<sub>0</sub>E", "1/2 &epsilon;<sub>0</sub>E<sup>2</sup>", "&epsilon;<sub>0</sub>E<sup>2</sup>", "1/2 &epsilon;<sub>0</sub><sup>2</sup>E"], ans: 1, type: "PYQ", year: "2022" },

    { id: 48, ch: 1, text: "विद्युत विभव (Electric Potential) का मात्रक है:", options: ["जूल-कूलॉम", "जूल/कूलॉम (वोल्ट)", "न्यूटन/कूलॉम", "कूलॉम/जूल"], ans: 1, type: "PYQ", year: "2019" },

        // --- 2. STATE MANAGEMENT ---
        let currentQuestions = [];
        let testQuestions = [];
        let currentTestIndex = 0;
        let score = 0;
        let testTimer;
        let timeLeft = 0;
        let testAnswers = {}; // user selected answers
        let showAnswersGlobal = false;

        // Theme Initialization
        function initTheme() {
            const savedTheme = localStorage.getItem("physics_theme") || "dark";
            document.body.setAttribute("data-theme", savedTheme);
        }

        function toggleTheme() {
            const current = document.body.getAttribute("data-theme");
            const newTheme = current === "dark" ? "light" : "dark";
            document.body.setAttribute("data-theme", newTheme);
            localStorage.setItem("physics_theme", newTheme);
        }

        // --- 3. UI NAVIGATION ---
        function showSection(id) {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('qbank_view').classList.add('hidden');
            document.getElementById('test_view').classList.add('hidden');
            document.getElementById('result_view').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
            clearInterval(testTimer);
        }

        // --- 4. DASHBOARD RENDER ---
        function renderDashboard() {
            const grid = document.getElementById('chapterGrid');
            grid.innerHTML = '';
            chapters.forEach((chName, index) => {
                const totalQ = questionBank.filter(q => q.ch === index).length;
                grid.innerHTML += `
                    <div class="card" onclick="openChapter(${index})">
                        <h3>${index + 1}. ${chName}</h3>
                        <p>कुल प्रश्न: ${totalQ}</p>
                        <div class="progress-bar"><div class="progress-fill" style="width: 100%"></div></div>
                        <button class="btn" style="margin-top:10px; width:100%;" onclick="startChapterTest(event, ${index})">Test शुरू करें</button>
                    </div>
                `;
            });
        }

        // --- 5. QUESTION BANK LOGIC ---
        function openChapter(chIndex) {
            currentQuestions = questionBank.filter(q => q.ch === chIndex);
            document.getElementById('qbank_title').innerText = chapters[chIndex];
            renderQList(currentQuestions);
            showSection('qbank_view');
        }

        function renderAllQuestions() {
            currentQuestions = [...questionBank];
            document.getElementById('qbank_title').innerText = "सम्पूर्ण पाठ्यक्रम (All Chapters)";
            renderQList(currentQuestions);
        }

        function filterQuestions() {
            const text = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('typeFilter').value;
            let filtered = currentQuestions.filter(q => {
                const matchText = q.text.toLowerCase().includes(text);
                const matchType = type === "All" || q.type === type;
                return matchText && matchType;
            });
            renderQList(filtered);
        }

        function toggleAllAnswers() {
            showAnswersGlobal = !showAnswersGlobal;
            document.querySelectorAll('.ans-box').forEach(el => {
                el.style.display = showAnswersGlobal ? 'block' : 'none';
            });
        }

        function toggleSingleAnswer(id) {
            const el = document.getElementById(`ans_${id}`);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function renderQList(qList) {
            const box = document.getElementById('qList');
            box.innerHTML = '';
            if(qList.length === 0) { box.innerHTML = '<p>कोई प्रश्न नहीं मिला।</p>'; return; }
            
            qList.forEach((q, i) => {
                let optionsHtml = '';
                q.options.forEach((opt, idx) => {
                    optionsHtml += `<li>(${String.fromCharCode(65 + idx)}) ${opt}</li>`;
                });
                
                let tags = `<span class="badge">${q.type}</span>`;
                if(q.year) tags += ` <span class="badge" style="background:#8e44ad;">${q.year}</span>`;

                box.innerHTML += `
                    <div class="q-box">
                        <div class="q-header">
                            <span>प्रश्न ${q.id} (अध्याय ${q.ch + 1})</span>
                            <div>${tags}</div>
                        </div>
                        <div class="q-text">${q.text}</div>
                        <ul class="options">${optionsHtml}</ul>
                        <button class="btn btn-sec" onclick="toggleSingleAnswer(${q.id})">उत्तर देखें</button>
                        <div class="ans-box" id="ans_${q.id}" style="display:${showAnswersGlobal ? 'block' : 'none'}">
                            <strong>सही उत्तर:</strong> (${String.fromCharCode(65 + q.ans)}) ${q.options[q.ans]}
                        </div>
                    </div>
                `;
            });
        }

        // --- 6. TEST SYSTEM LOGIC ---
        function startChapterTest(e, chIndex) {
            e.stopPropagation();
            const qList = questionBank.filter(q => q.ch === chIndex);
            if(qList.length === 0) { alert("इस अध्याय में अभी प्रश्न नहीं हैं।"); return; }
            startTestMode(qList);
        }

        function startFullMockTest() {
            // Randomize and pick up to 50 questions
            let shuffled = [...questionBank].sort(() => 0.5 - Math.random());
            startTestMode(shuffled.slice(0, 50));
        }

        function startTestMode(qList) {
            testQuestions = qList;
            currentTestIndex = 0;
            testAnswers = {};
            score = 0;
            timeLeft = testQuestions.length * 10; // 45 seconds per question
            
            document.getElementById('t_total').innerText = testQuestions.length;
            showSection('test_view');
            loadTestQuestion();
            
            testTimer = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 30);
                let s = timeLeft % 60;
                document.getElementById('timer_display').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if(timeLeft <= 0) submitTest();
            }, 1000);
        }

        function loadTestQuestion() {
            const q = testQuestions[currentTestIndex];
            document.getElementById('t_current').innerText = currentTestIndex + 1;
            document.getElementById('t_type').innerText = q.type;
            document.getElementById('t_question').innerHTML = q.text;
            
            const optBox = document.getElementById('t_options');
            optBox.innerHTML = '';
            q.options.forEach((opt, idx) => {
                let statusClass = '';
                // If already answered, disable clicking and show colors
                if(testAnswers[currentTestIndex] !== undefined) {
                    if(idx === q.ans) statusClass = 'correct-reveal';
                    else if(idx === testAnswers[currentTestIndex]) statusClass = 'wrong-reveal';
                }
                
                optBox.innerHTML += `
                    <div class="test-option ${statusClass}" onclick="selectTestOption(${idx})">
                        (${String.fromCharCode(65 + idx)}) ${opt}
                    </div>
                `;
            });

            const btn = document.getElementById('t_submit_btn');
            if(currentTestIndex === testQuestions.length - 1) {
                btn.innerText = "Submit Test";
                btn.classList.add("danger");
            } else {
                btn.innerText = "Next";
                btn.classList.remove("danger");
            }
        }

        function selectTestOption(idx) {
            if(testAnswers[currentTestIndex] !== undefined) return; // Prevent double clicking
            testAnswers[currentTestIndex] = idx;
            if(idx === testQuestions[currentTestIndex].ans) score++;
            loadTestQuestion(); // Reload to show colors immediately
        }

        function nextTestQuestion() {
            if(currentTestIndex < testQuestions.length - 1) {
                currentTestIndex++;
                loadTestQuestion();
            } else {
                submitTest();
            }
        }

        function prevTestQuestion() {
            if(currentTestIndex > 0) {
                currentTestIndex--;
                loadTestQuestion();
            }
        }

        function submitTest() {
            clearInterval(testTimer);
            showSection('result_view');
            const total = testQuestions.length;
            const perc = Math.round((score / total) * 100);
            
            document.getElementById('r_total').innerText = total;
            document.getElementById('r_correct').innerText = score;
            document.getElementById('r_wrong').innerText = total - score;
            
            const circle = document.getElementById('r_score');
            circle.innerText = perc + '%';
            circle.style.borderColor = perc >= 60 ? 'var(--secondary)' : (perc >= 33 ? '#f39c12' : 'var(--danger)');
        }

        // Initialize App
        window.onload = () => {
            initTheme();
            renderDashboard();
        };
    </script>
</body>
</html>
