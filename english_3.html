            line-height: 1.5;

            margin-bottom: 8px;
            font-size: 16px;
            background-color: #fff;
            border: 1px solid #cbd5e1;
            color: #334155;

            cursor: pointer;

            border-color: #38bdf8;

            color: #fff !important;

            padding: 10px;

        }
    </style>
</head>
