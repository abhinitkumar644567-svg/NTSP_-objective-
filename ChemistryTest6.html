        { q: "54. [Co(NH₃)₅Br]SO₄ एवं [Co(NH₃)₅SO₄]Br एक-दूसरे के हैं :", options: ["(A) आयनन समावयव", "(B) लिंकेज समावयव", "(C) समन्वय समावयव", "(D) ज्यामितिक समावयव"], ans: 0 },
        { q: "55. विटामिन B₁₂ में उपस्थित रहता है :", options: ["(A) कोबाल्ट", "(B) मैग्नीशियम", "(C) लोहा", "(D) निकेल"], ans: 0 },
        { q: "56. जब क्लोरोफॉर्म ऐसीटोन से अभिक्रिया करता है, तब निम्नलिखित में कौन बनता है?", options: ["(A) एथिलीन डाइक्लोराइड", "(B) मेसिटिलीन", "(C) क्लोरेटोन", "(D) क्लोरल"], ans: 2 },
        { q: "57. अभिक्रिया aA + bB → उत्पाद के लिए -d[A]/dt बराबर होता है :", options: ["(A) -d[B]/dt", "(B) -b/d[B]/dt", "(C) -a/b (d[B]/dt)", "(D) -b/a (d[B]/dt)"], ans: 2 },
        { q: "58. रेडियोसक्रिय क्षय है एक :", options: ["(A) शून्य कोटि की अभिक्रिया", "(B) प्रथम कोटि की अभिक्रिया", "(C) द्वितीय कोटि की अभिक्रिया", "(D) तृतीय कोटि की अभिक्रिया"], ans: 1 },
        { q: "59. 288 K पर 1 ग्राम चारकोल के द्वारा H₂, CH₄, CO₂ एवं NH₃ गैसों के अधिशोषित आयतन का क्रम है :", options: ["(A) H₂ > CH₄ > CO₂ > NH₃", "(B) CH₄ > CO₂ > NH₃ > H₂", "(C) CO₂ > NH₃ > H₂ > CH₄", "(D) NH₃ > CO₂ > CH₄ > H₂"], ans: 3 },
        { q: "60. लैंगमूर के अधिशोषण समताप का सही व्यंजक है :", options: ["(A) x/m = (1+aP)/b", "(B) x/m = aP/(1+bP)", "(C) x/m = (1+aP)/(1+bP)", "(D) x/m = 1/a + bP/a"], ans: 1 },
        { q: "61. कोलाइडी कणों का आकार होता है :", options: ["(A) 1 nm - 10 nm", "(B) 10 nm - 100 nm", "(C) 1 nm - 100 nm", "(D) 10 nm - 1000 nm"], ans: 2 },
        { q: "62. धुआँ एक कोलाइडी अवस्था है जिसमें :", options: ["(A) एक गैस ठोस में परिक्षिप्त रहता है", "(B) एक ठोस गैस में परिक्षिप्त रहता है", "(C) एक गैस गैस में परिक्षिप्त रहता है", "(D) एक द्रव गैस में परिक्षिप्त रहता है"], ans: 1 },
        { q: "63. मक्खन एक उदाहरण है :", options: ["(A) जेल का", "(B) पायस का", "(C) सॉल का", "(D) फोम का"], ans: 0 },
        { q: "64. एक फलक केन्द्रित घनाकार इकाई सेल में परमाणुओं की संख्या होती है :", options: ["(A) 2", "(B) 3", "(C) 4", "(D) 12"], ans: 2 },
        { q: "65. पिंड-केन्द्रित घनाकार सेल में पैकिंग का संकुलन गुणांक होता है :", options: ["(A) 0.42", "(B) 0.53", "(C) 0.68", "(D) 0.82"], ans: 2 },
        { q: "66. निम्नलिखित में कौन लौहचुंबकीय पदार्थ है?", options: ["(A) Fe", "(B) Cu", "(C) NaCl", "(D) MnO"], ans: 0 },
        { q: "67. निम्नलिखित में किसमें फ्रेंकेल दोष है?", options: ["(A) सोडियम क्लोराइड", "(B) ग्रेफाइट", "(C) सिल्वर क्लोराइड", "(D) हीरा"], ans: 2 },
        { q: "68. निम्नलिखित में किस यौगिक का जलीय घोल असामान्य परासरणी दाब प्रदर्शित करता है?", options: ["(A) यूरिया", "(B) सामान्य नमक", "(C) ग्लूकोस", "(D) सुक्रोज"], ans: 1 },
        { q: "69. किसी विलेय के विलायक में एक मोलल घोल के क्वथनांक उन्नयन को कहा जाता है :", options: ["(A) क्वथनांकमापी स्थिरांक", "(B) वाष्प-दाब स्थिरांक", "(C) हिमांकमितीय स्थिरांक", "(D) इनमें से कोई नहीं"], ans: 0 },
        { q: "70. निम्नलिखित में किसके जलीय घोल का वाष्प-दाब सबसे कम होगा?", options: ["(A) 0.1 M BaCl₂", "(B) 0.1 M यूरिया", "(C) 0.1 M Na₂SO₄", "(D) 0.1 M Na₃PO₄"], ans: 3 }
    ];

    const quizContainer = document.getElementById('quiz-container');

    questions.forEach((qObj, qIndex) => {
        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        
        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerHTML = qObj.q;
        qBox.appendChild(qText);
        
        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';
        
        const feedbackBox = document.createElement('div');
        feedbackBox.className = 'feedback';
        
        qObj.options.forEach((opt, optIndex) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            
            btn.onclick = () => {
                const allBtns = optionsList.querySelectorAll('.option-btn');
                allBtns.forEach(b => b.disabled = true);
                
                if (optIndex === qObj.ans) {
                    btn.classList.add('correct');
                    feedbackBox.innerHTML = "✅ बिल्कुल सही जवाब!";
                    feedbackBox.className = 'feedback feedback-correct';
                } else {
                    btn.classList.add('incorrect');
                    allBtns[qObj.ans].classList.add('correct');
                    feedbackBox.innerHTML = "❌ गलत जवाब। सही उत्तर: " + qObj.options[qObj.ans] + " है।";
                    feedbackBox.className = 'feedback feedback-wrong';
                }
                feedbackBox.style.display = 'block';
            };
            
            const li = document.createElement('li');
            li.appendChild(btn);
            optionsList.appendChild(li);
        });
        
        qBox.appendChild(optionsList);
        qBox.appendChild(feedbackBox);
        quizContainer.appendChild(qBox);
    });
</script>
