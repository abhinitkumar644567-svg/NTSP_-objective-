<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHYSICS 12th (2026) - 70 Objective Test with Timer</title>
    <style>
        /* प्रीमियम कलर ग्रेडिंग और आकर्षक डिज़ाइन */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 3px dashed #6c5ce7;
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }
        .info-bar {
            text-align: center;
            font-size: 16px;
            color: #fff;
            background: linear-gradient(to right, #6c5ce7, #a29bfe);
            margin-bottom: 25px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
        }

        /* --- टाइमर का डिज़ाइन --- */
        .timer-box {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            z-index: 1000;
            letter-spacing: 1px;
            border: 2px solid #fff;
        }

        /* मोबाइल स्क्रीन पर टाइमर को बीच में सेट करने के लिए */
        @media (max-width: 600px) {
            .timer-box {
                top: 10px;
                right: 50%;
                transform: translateX(50%);
                font-size: 16px;
                padding: 10px 20px;
            }
            .container { margin-top: 50px; }
        }

        .q-box {
            margin-bottom: 20px;
            padding: 18px;
            border-left: 6px solid #a29bfe;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            transition: transform 0.2s ease;
        }
        .q-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }
        .q-text {
            font-size: 17px;
            font-weight: bold;
            color: #2d3436;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .opt-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 18px;
            margin-bottom: 10px;
            font-size: 15px;
            background-color: #f8f9fa;
            border: 2px solid #dfe6e9;
            color: #2d3436;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-weight: 500;
        }
        .opt-btn:hover:not(:disabled) {
            background-color: #f1f2f6;
            border-color: #a29bfe;
            transform: scale(1.01);
        }
        .opt-btn:disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }
        .correct {
            background: linear-gradient(135deg, #00b09b, #96c93d) !important;
            border-color: #00b09b !important;
            color: #fff !important;
            box-shadow: 0 4px 10px rgba(0, 176, 155, 0.4);
            font-weight: bold;
        }
        .incorrect {
            background: linear-gradient(135deg, #ff416c, #ff4b2b) !important;
            border-color: #ff416c !important;
            color: #fff !important;
            box-shadow: 0 4px 10px rgba(255, 65, 108, 0.4);
            font-weight: bold;
        }
        .feedback {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<!-- टाइमर का बॉक्स -->
<div id="timer" class="timer-box">⏱️ 01:00:00</div>

<div class="container">
    <h1>PHYSICS (भौतिकी) - XII, 2026 (A)</h1>
    <div class="info-bar">कुल प्रश्न: 70 | समय: 1 घंटा | सही विकल्प चुनें</div>
    <div id="quiz-container"></div>
</div>

<script>
    // --- टाइमर का JavaScript कोड ---
    let timeInSeconds = 3600; // 1 घंटा (60 मिनट * 60 सेकंड)
    const timerElement = document.getElementById('timer');

    const countdown = setInterval(() => {
        if (timeInSeconds <= 0) {
            clearInterval(countdown);
            timerElement.innerHTML = "⏳ समय समाप्त!";
            timerElement.style.background = "linear-gradient(135deg, #333, #000)";
            
            // समय खत्म होने पर सभी बटन डिसेबल कर दें
            const allButtons = document.querySelectorAll('.opt-btn');
            allButtons.forEach(btn => btn.disabled = true);
            alert("आपका समय समाप्त हो गया है! अब आप उत्तर नहीं दे सकते।");
            return;
        }

        timeInSeconds--;
        
        let hours = Math.floor(timeInSeconds / 3600);
        let minutes = Math.floor((timeInSeconds % 3600) / 60);
        let seconds = timeInSeconds % 60;

        // सिंगल डिजिट को डबल डिजिट (01, 02) बनाने के लिए
        hours = hours < 10 ? "0" + hours : hours;
        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;

        timerElement.innerHTML = `⏱️ ${hours}:${minutes}:${seconds}`;
    }, 1000); // हर 1000 मिलीसेकंड (1 सेकंड) में अपडेट होगा


    // --- 70 प्रश्न बिल्कुल किताबी भाषा में ---
    const questions = [
        { q: "1. समानांतर संयोजन में प्रतिरोधों का तुल्य प्रतिरोध :", options: ["(A) घट जाता है", "(B) बढ़ जाता है", "(C) वही रहता है", "(D) इनमें से कोई नहीं"], ans: 0 },
        { q: "2. धारावाही परिनालिका के अंदर चुम्बकीय क्षेत्र रेखाएँ हैं :", options: ["(A) वृत्ताकार", "(B) समानांतर तथा सीधी", "(C) परवलय", "(D) इनमें से कोई नहीं"], ans: 1 },
        { q: "3. कलासंबद्ध स्रोत वे स्रोत हैं जिनके बीच :", options: ["(A) कलान्तर स्थिर रहता है", "(B) आयाम स्थिर रहता है", "(C) आवृत्ति स्थिर रहती है", "(D) कलान्तर तथा आवृत्ति दोनों स्थिर रहते हैं"], ans: 0 },
        { q: "4. सूर्य से प्राप्त प्राकृतिक प्रकाश होता है :", options: ["(A) ध्रुवित", "(B) अध्रुवित", "(C) आंशिक ध्रुवित", "(D) रेखीय ध्रुवित"], ans: 1 },
        { q: "5. रेडियोधर्मिता की खोज किसने की थी?", options: ["(A) मैरी क्यूरी", "(B) पियरे क्यूरी", "(C) अर्नेस्ट रदरफोर्ड", "(D) हेनरी बेक्वेरेल"], ans: 3 },
        { q: "6. प्रसारण विधि द्वारा संचार का उदाहरण है :", options: ["(A) टेलीफोन", "(B) रेडियो", "(C) टेलीविजन", "(D) (B) और (C) दोनों"], ans: 3 },
        { q: "7. किस उपकरण का उपयोग विभव नियंत्रक के रूप में किया जाता है?", options: ["(A) जेनर डायोड", "(B) ट्रांसफार्मर", "(C) ट्रांजिस्टर", "(D) प्रकाश डायोड"], ans: 0 },
        { q: "8. 'World Wide Web' का आविष्कार किसने किया था?", options: ["(A) टिम बर्नर्स-ली", "(B) जॉन लोगी बेयर्ड", "(C) अलेक्जेंडर बैन", "(D) जी. मार्कोनी"], ans: 0 },
        { q: "9. निम्नलिखित में से कौन-सा व्यंजक वैद्युत ऊर्जा को दर्शाता है?", options: ["(A) V.I.t", "(B) V²/R", "(C) I².R.t", "(D) इनमें से सभी"], ans: 3 },
        { q: "10. एक ऐल्फा-कण को दूसरे ऐल्फा-कण की ओर लाने पर निकाय की स्थितिज ऊर्जा :", options: ["(A) बढ़ती है", "(B) घटती है", "(C) अपरिवर्तित रहती है", "(D) इनमें से कोई नहीं"], ans: 0 },
        { q: "11. पानी का परावैद्युत स्थिरांक होता है :", options: ["(A) 80", "(B) 1", "(C) 0", "(D) अनंत"], ans: 0 },
        { q: "12. धारा घनत्व J, विशिष्ट चालकता σ तथा वैद्युत क्षेत्र की तीव्रता E के बीच संबंध है :", options: ["(A) E = σ J", "(B) E = J/σ", "(C) J = σ E", "(D) J = σ² E"], ans: 2 },
        { q: "13. कार्बन प्रतिरोध के पीले रंग के कोड का मान है :", options: ["(A) 4", "(B) 2", "(C) 3", "(D) 5"], ans: 0 },
        { q: "14. सापेक्ष पारगम्यता बराबर है :", options: ["(A) μ_r = μ₀/μ", "(B) μ_r = μ/μ₀", "(C) μ_r = 1", "(D) μ_r = √(μ/μ₀)"], ans: 1 },
        { q: "15. B₀²/μ₀ की विमाएँ वही होंगी जो :", options: ["(A) ऊर्जा घनत्व की होगी", "(B) कार्य की होगी", "(C) संवेग की होगी", "(D) वैद्युत फ्लक्स की होगी"], ans: 0 },
        { q: "16. अनुचुम्बकीय पदार्थ की चुम्बकशीलता होती है :", options: ["(A) शून्य", "(B) एक से अधिक", "(C) एक से कम", "(D) ऋणात्मक"], ans: 1 },
        { q: "17. अर्द्ध-तरंग दिष्टकारी में यदि निवेशी आवृत्ति 50 Hz है, तो निर्गम आवृत्ति होगी :", options: ["(A) 25 Hz", "(B) 50 Hz", "(C) 100 Hz", "(D) 0 Hz"], ans: 1 },
        { q: "18. 1 मिलीग्राम द्रव्यमान क्षति से कितने जूल ऊर्जा मुक्त होगी?", options: ["(A) 9 × 10¹⁰ J", "(B) 3 × 10⁸ J", "(C) 9 × 10¹³ J", "(D) 3 × 10¹⁰ J"], ans: 0 },
        { q: "19. 49 V और 64 V से त्वरित दो इलेक्ट्रॉनों से जुड़ी डी ब्रोग्ली तरंगदैर्ध्य का अनुपात है :", options: ["(A) 49/64", "(B) 64/49", "(C) 8/7", "(D) 7/8"], ans: 2 },
        { q: "20. प्रकाश की एक किरण समतल दर्पण पर अभिलम्बवत् रूप से आपतित होती है। परावर्तन कोण होगा :", options: ["(A) 90°", "(B) 0°", "(C) 180°", "(D) 45°"], ans: 1 },
        { q: "21. कलान्तर φ पथांतर λ से संबंधित है :", options: ["(A) λ/2π * φ", "(B) 2π/λ * φ", "(C) φ/λ", "(D) λ/φ"], ans: 0 },
        { q: "22. दूर दृष्टिदोष को दूर करने के लिए प्रयुक्त लेंस होता है :", options: ["(A) उत्तल", "(B) अवतल", "(C) बेलनाकार", "(D) समतलोत्तल"], ans: 0 },
        { q: "23. प्रकाश की तीव्रता का व्युत्क्रम वर्ग नियम अर्थात् तीव्रता ∝ 1/r² मान्य होता है :", options: ["(A) बिन्दु स्रोत के लिए", "(B) रेखीय स्रोत के लिए", "(C) बेलनाकार स्रोत के लिए", "(D) समतल स्रोत के लिए"], ans: 0 },
        { q: "24. बोहर कक्षा में एक इलेक्ट्रॉन की गतिज ऊर्जा (K) उसकी स्थितिज ऊर्जा (U) से किस प्रकार सम्बन्धित होती है?", options: ["(A) K = U", "(B) K = -U", "(C) K = -U/2", "(D) K = -2U"], ans: 2 },
        { q: "25. अर्द्धचालक को प्रबल धारा से क्षति किस कारण होती है?", options: ["(A) मुक्त इलेक्ट्रॉनों की कमी से", "(B) प्रोटॉनों की अधिकता से", "(C) इलेक्ट्रॉनों की अधिकता से", "(D) ऊष्मीय प्रभाव के कारण"], ans: 3 },
        { q: "26. किसी जर्मेनियम को p-टाइप अर्द्धचालक में परिवर्तित करने के लिए अपद्रव्य तत्व की संयोजकता है :", options: ["(A) 2", "(B) 3", "(C) 4", "(D) 5"], ans: 1 },
        { q: "27. संचार प्रणाली में पुनरावर्तक होता है :", options: ["(A) अभिग्राही", "(B) प्रेषित्र", "(C) अभिग्राही और प्रेषित्र का संयोजन", "(D) इनमें से कोई नहीं"], ans: 2 },
        { q: "28. किसी धातु पृष्ठ से उत्सर्जित इलेक्ट्रॉन का अधिकतम वेग दोगुना हो जाता है जब आपतित प्रकाश की आवृत्ति v को दोगुना करते हैं। धातु का कार्यफलन है :", options: ["(A) hv", "(B) 2hv", "(C) शून्य", "(D) hv/2"], ans: 2 },
        { q: "29. यदि एक छड़ चुम्बक को उसकी लम्बाई के लम्बवत् दो बराबर भागों में काटा जाये, तो प्रत्येक टुकड़ा :", options: ["(A) अपना चुम्बकत्व खो देगा", "(B) एक ध्रुव बन जायेगा", "(C) ज्यादा चुम्बकीय आघूर्ण के साथ एक नए चुम्बक की तरह व्यवहार करेगा", "(D) कम चुम्बकीय आघूर्ण के साथ एक नए चुम्बक की तरह व्यवहार करेगा"], ans: 3 },
        { q: "30. धारितीय प्रत्यावर्ती धारा परिपथ में धारा, विभवान्तर के :", options: ["(A) अग्रगामी होती है", "(B) पश्चगामी होती है", "(C) एक ही कला में होती है", "(D) इनमें से कोई नहीं"], ans: 0 },
        { q: "31. संधारित्र एक आदर्श कुचालक है :", options: ["(A) प्रत्यावर्ती धाराओं के लिए", "(B) दिष्ट धाराओं के लिए", "(C) (A) और (B) दोनों के लिए", "(D) इनमें से कोई नहीं"], ans: 1 },
        { q: "32. विस्थापन धारा का मात्रक होता है :", options: ["(A) Am", "(B) A", "(C) ΩA", "(D) ΩmA"], ans: 1 },
        { q: "33. सूर्य के प्रकाश का स्पेक्ट्रम होता है :", options: ["(A) सतत", "(B) रैखिक स्पेक्ट्रम", "(C) काली रेखा का स्पेक्ट्रम", "(D) काली पट्टी का स्पेक्ट्रम"], ans: 0 },
        { q: "34. दृश्य क्षेत्र अधिकतम होगा :", options: ["(A) समतल दर्पण के लिए", "(B) उत्तल दर्पण के लिए", "(C) अवतल दर्पण के लिए", "(D) बेलनाकार दर्पण के लिए"], ans: 1 },
        { q: "35. हवा में लाल प्रकाश तथा नीले प्रकाश के अपवर्तनांक का अनुपात है :", options: ["(A) एक से कम", "(B) एक से अधिक", "(C) एक के बराबर", "(D) इनमें से कोई नहीं"], ans: 0 },
        { q: "36. r₁ तथा r₂ त्रिज्याओं के दो चालक गोलों के पृष्ठों पर आवेश के पृष्ठ घनत्व बराबर हैं। पृष्ठों पर वैद्युत क्षेत्र की तीव्रताओं का अनुपात है :", options: ["(A) r₁²/r₂²", "(B) r₂²/r₁²", "(C) r₁/r₂", "(D) 1:1"], ans: 3 },
        { q: "37. ओम का नियम तब लागू नहीं होता है, जब :", options: ["(A) तापमान बदलता हो", "(B) तापमान स्थिर रहता हो", "(C) विभवान्तर बदलता हो", "(D) इनमें से कोई नहीं"], ans: 0 },
        { q: "38. प्राकृतिक विद्युत् चुम्बकीय प्रेरण का उदाहरण है :", options: ["(A) रेडियो", "(B) बिजली गिरना", "(C) बैटरी चार्जिंग", "(D) टेलीविजन"], ans: 1 },
        { q: "39. अपचायी ट्रांसफॉर्मर में कौन-सी राशि घटती है?", options: ["(A) धारा", "(B) वोल्टेज", "(C) आवृत्ति", "(D) शक्ति"], ans: 1 },

    const quizContainer = document.getElementById('quiz-container');

    questions.forEach((qObj, index) => {
        const qBox = document.createElement('div');
        qBox.className = 'q-box';
        
        const qText = document.createElement('div');
        qText.className = 'q-text';
        qText.innerHTML = qObj.q;
        qBox.appendChild(qText);
        
        const feedbackBox = document.createElement('div');
        feedbackBox.className = 'feedback';
        
        const btnGroup = document.createElement('div');
        
        qObj.options.forEach((opt, optIndex) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = opt;
            
            btn.onclick = () => {
                const allBtns = btnGroup.querySelectorAll('.opt-btn');
                allBtns.forEach(b => b.disabled = true);
                
                if (optIndex === qObj.ans) {
                    btn.classList.add('correct');
                    feedbackBox.innerHTML = "✅ बिल्कुल सही जवाब!";
                    feedbackBox.style.color = "#00b894";
                    feedbackBox.style.background = "#e8f8f5";
                    feedbackBox.style.border = "1px solid #55efc4";
                } else {
                    btn.classList.add('incorrect');
                    allBtns[qObj.ans].classList.add('correct');
                    feedbackBox.innerHTML = "❌ गलत उत्तर! सही विकल्प: " + qObj.options[qObj.ans].substring(0,3) + ")";
                    feedbackBox.style.color = "#d63031";
                    feedbackBox.style.background = "#ffefef";
                    feedbackBox.style.border = "1px solid #fab1a0";
                }
                feedbackBox.style.display = 'block';
            };
            btnGroup.appendChild(btn);
        });
        
        qBox.appendChild(btnGroup);
        qBox.appendChild(feedbackBox);
        quizContainer.appendChild(qBox);
    });
