/* ================= प्रश्न लोड ================= */
const Q=RAW.trim().split('\n').map(l=>{const p=l.split('§');return{q:p[0],o:p.slice(1,5),a:+p[5]}});
const $=id=>document.getElementById(id),L='ABCD',T=3600;
const KEY='math-xii-2023a-record';
let left=T,tid,fin=false,deadline=0;const ans=Q.map(()=>null);

function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s)return;s.ans.forEach((v,i)=>{if(i<ans.length)ans[i]=v});fin=!!s.fin;deadline=s.deadline||0}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({ans,fin,deadline}))}catch(e){}}
function resetTest(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}

function init(){
  load();
  const w=$('qw');
  Q.forEach((it,i)=>{
    const d=document.createElement('div');d.className='q';d.id='q'+i;
    d.innerHTML=`<div class="qt"><span class="no">${i+1}.</span>${it.q}</div><div class="os">${it.o.map((t,j)=>`<div class="o" data-i="${i}" data-j="${j}"><span class="l">${L[j]}</span><span>${t}</span></div>`).join('')}</div><div class="al"></div>`;
    w.appendChild(d);
  });
  w.onclick=e=>{const o=e.target.closest('.o');if(o)pick(+o.dataset.i,+o.dataset.j)};
  $('sb').onclick=$('sb2').onclick=()=>{if(!fin&&confirm('क्या आप टेस्ट सबमिट करना चाहते हैं?'))finish()};
  stats();
  if(!deadline&&!fin)deadline=Date.now()+T*1000;
  ans.forEach((_,i)=>{if(ans[i]!==null||fin)paint(i)});
  save();
  if(fin){fin=false;finish(false);return}
  tick();tid=setInterval(tick,1000);
}
function tick(){
  left=Math.max(0,Math.round((deadline-Date.now())/1000));
  $('tm').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  $('tm').classList.toggle('w',left<=300&&left>60);$('tm').classList.toggle('d',left<=60);
  if(left<=0){finish(true);return}
}
function pick(i,j){if(fin||ans[i]!==null)return;ans[i]=j;paint(i);stats();save()}
function paint(i){
  const b=$('q'+i),a=ans[i],c=Q[i].a,done=a!==null||fin;
  b.classList.remove('c','x');
  b.querySelectorAll('.o').forEach((el,j)=>{
    el.className='o'+(done?' k':'');
    if(done&&j===c)el.classList.add('ok');
    if(a===j&&j!==c)el.classList.add('bad');
    if(done&&a!==null&&j!==c&&j!==a)el.classList.add('dim');
  });
  const al=b.querySelector('.al');
  if(a===null)al.innerHTML=fin?`<span class="bd no">उत्तर नहीं दिया</span><span class="at">सही उत्तर: (${L[c]})</span>`:'';
  else if(a===c){b.classList.add('c');al.innerHTML=`<span class="bd ok">✔ सही</span><span class="at">उत्तर: (${L[c]})</span>`}
  else{b.classList.add('x');al.innerHTML=`<span class="bd bad">✖ गलत</span><span class="at">सही उत्तर: (${L[c]})</span>`}
}
function stats(){
  let c=0,t=0;ans.forEach((a,i)=>{if(a!==null){t++;if(a===Q[i].a)c++}});
  $('sc').textContent=c;$('sw').textContent=t-c;$('sl').textContent=Q.length-t;
  $('pb').style.width=t/Q.length*100+'%';return{c,t};
}
function finish(auto){
  if(fin)return;fin=true;clearInterval(tid);save();Q.forEach((_,i)=>paint(i));
  $('sb').disabled=$('sb2').disabled=true;
  const{c,t}=stats(),p=Math.round(c/Q.length*100),u=T-Math.max(left,0);
  $('rs').innerHTML=`${c}<small>/${Q.length}</small>`;$('rc').textContent=c;$('rw').textContent=t-c;$('rk').textContent=Q.length-t;
  $('rm').textContent=(auto?'समय समाप्त! ':'')+`समय: ${Math.floor(u/60)} मिनट ${u%60} सेकंड · ${p}% · `+(p>=75?'उत्कृष्ट प्रदर्शन!':p>=50?'अच्छा प्रयास!':'गलत प्रश्नों की समीक्षा करें।');
  $('ov').classList.add('s');
}
init();
