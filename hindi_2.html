<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HINDI 12th (2022) - 100 Objective Test</title>
    <style>
        /* आकाशी (Sky Blue) और लाल (Red) का प्रीमियम कॉम्बिनेशन - No White Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #ff7eb3 100%);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            color: #4a0000;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #e3f2fd; /* Light Sky #1affbdce, No White */
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(183, 28, 28, 0.3);
            border: 2px solid #ef5350;
        }
        h1 {
            text-align: center;
            font-size: 26px;
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 3px dashed #d32f2f;
            color: #b71c1c;
            font-weight: 900;
        }
        .info-bar {
            text-align: center;
            font-size: 16px;
            color: #e3f2fd;
            background: linear-gradient(to right, #1dde00, #d32f2f);
            margin-bottom: 25px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.4);
        }
        /* --- टाइमर का डिज़ाइन --- */
        .timer-box {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            color: #bbdefb;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(183, 28, 28, 0.5);
            z-index: 1000;
            letter-spacing: 1px;
            border: 2px solid #ffcdd2;
        }
        @media (max-width: 600px) {
            .timer-box {
                top: 10px;
                right: 50%;
                transform: translateX(50%);
                font-size: 16px;
                padding: 10px 20px;
            }
            .container { margin-top: 50px; }
        }
        .q-box {
            margin-bottom: 20px;
            padding: 18px;
            border-left: 5px solid #d32f2f;
            border-radius: 8px;
            background: #bbdefb; /* Deeper Sky Blue */
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            transition: transform 0.2s ease;
        }
        .q-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(211, 47, 47, 0.3);
        }
        .q-text {
            font-size: 17px;
            font-weight: bold;
            color: #01579b;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .opt-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 18px;
            margin-bottom: 8px;
            font-size: 16px;
            background-color: #e1f5fe;
            border: 1px solid #0288d1;
            color: #0d47a1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-weight: bold;
        }
        .opt-btn:hover:not(:disabled) {
            background-color: #ffcdd2;
            border-color: #d32f2f;
            color: #b71c1c;
            transform: translateX(4px);
        }
        .opt-btn:disabled {
            cursor: not-allowed;
            opacity: 0.95;
        }
        .correct {
            background: linear-gradient(to right, #13f924, #21eb859b) !important;
            border-color: #ff5e52b4 !important;
            color: #e1f5fe !important;
            font-weight: bold;
        }
        .incorrect {
            background: linear-gradient(to right, #d32f2f, #f44336) !important;
            border-color: #b71c1c !important;
            color: #ffebee !important;
            font-weight: bold;
        }
        .feedback {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div id="timer" class="timer-box">⏱️ 01:00:00</div>

<div class="container">
    <h1>HINDI (हिन्दी) - XII (100 अंक) - 2022 (A)</h1>
    <div class="info-bar">कुल प्रश्न: 100 | समय: 1 घंटा | सही विकल्प चुनें</div>
    <div id="quiz-container"></div>
</div>

<script>
    // 1 Hour Timer
    let timeInSeconds = 3600; 
    const timerElement = document.getElementById('timer');

    const countdown = setInterval(() => {
        if (timeInSeconds <= 0) {
            clearInterval(countdown);
            timerElement.innerHTML = "⏳ Time Up!";
            timerElement.style.background = "linear-gradient(135deg, #b71c1c, #d32f2f)";
            document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
            alert("आपका समय समाप्त हो गया है! अब आप और उत्तर नहीं दे सकते।");
            return;
        }
        timeInSeconds--;
        let h = Math.floor(timeInSeconds / 3600), m = Math.floor((timeInSeconds % 3600) / 60), s = timeInSeconds % 60;
        timerElement.innerHTML = `⏱️ ${h<10?'0'+h:h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
    }, 1000); 

    // Compressed Array of 100 Questions (From Hindi 2022 A Images)
    const q=[
{q:"1. 'तुमुल कोलाहल कलह में' शीर्षक कविता किस महाकाव्य का अंश है?",o:["(A) अष्टयाम","(B) लहर","(C) कामायनी","(D) मुकुल"],a:2},
{q:"2. वर्ग 9 तक की पढ़ाई के बाद शिक्षा अधूरी छोड़कर कौन कवयित्री असहयोग आंदोलन में कूद पड़ी थीं?",o:["(A) मीराबाई","(B) महादेवी वर्मा","(C) अनामिका","(D) सुभद्रा कुमारी चौहान"],a:3},
{q:"3. \"तेज तम अंस पर कान्ह जिमि कंस पर, यों म्लेच्छ बंस पर सेर सिवराज है\"- यह पंक्ति किस शीर्षक कविता की है?",o:["(A) कवित्त","(B) पद (तुलसीदास)","(C) छप्पय","(D) पद (सूरदास)"],a:0},
{q:"4. भूषण ने किस रस को प्रमुखता दी है?",o:["(A) हास्य रस","(B) वीर रस","(C) रौद्र रस","(D) शृंगार रस"],a:1},
{q:"5. गोस्वामी तुलसीदास हिंदी के कैसे महाकवि हैं?",o:["(A) जातीय महाकवि","(B) स्वच्छन्द महाकवि","(C) अन्तर्जातीय महाकवि","(D) रूढ़िवादी महाकवि"],a:0},
{q:"6. 'म' का उच्चारण-स्थान क्या है?",o:["(A) कंठ","(B) ओष्ठ","(C) तालु","(D) दंत"],a:1},
{q:"7. 'पृथ्वीश' शब्द का संधि-विच्छेद क्या है?",o:["(A) पृथ्वी + श","(B) पृ + थ्वीश","(C) पृथ्वी + ईश","(D) पृथ + वीश"],a:2},
{q:"8. निम्न में शुद्ध कौन है?",o:["(A) प्रमेश्वर","(B) परिक्षण","(C) प्रान","(D) परीक्षा"],a:3},
{q:"9. 'वाराणसी' शब्द कौन संज्ञा है?",o:["(A) व्यक्तिवाचक","(B) जातिवाचक","(C) भाववाचक","(D) समूहवाचक"],a:0},
{q:"10. 'नगर' शब्द क्या है?",o:["(A) स्त्रीलिंग","(B) पुल्लिंग","(C) उभयलिंग","(D) इनमें से कोई नहीं"],a:1},
{q:"11. हिंदी में वचन के कितने प्रकार हैं?",o:["(A) एक","(B) तीन","(C) दो","(D) चार"],a:2},
{q:"12. 'तीर से बाघ मार दिया गया' - किस कारक का उदाहरण है?",o:["(A) संप्रदान","(B) अपादान","(C) संबोधन","(D) करण"],a:3},
{q:"13. 'यह मेरा छोटा भाई सौरभ है' - किस सर्वनाम का उदाहरण है?",o:["(A) निश्चयवाचक","(B) निजवाचक","(C) संबंधवाचक","(D) अनिश्चयवाचक"],a:2},
{q:"14. 'सब धन' - कौन सा विशेषण है?",o:["(A) संख्यावाचक","(B) परिमाणबोधक","(C) गुणवाचक","(D) सार्वनामिक"],a:1},
{q:"15. क्रिया के कितने भेद होते हैं?",o:["(A) तीन","(B) चार","(C) दो","(D) पाँच"],a:2},
{q:"16. 'वह जाएगा' किस काल का उदाहरण है?",o:["(A) वर्तमान काल का","(B) भूतकाल का","(C) संदिग्ध भूतकाल का","(D) भविष्यत काल का"],a:3},
{q:"17. 'पगड़ी' शब्द क्या है?",o:["(A) देशज","(B) विदेशज","(C) तत्सम","(D) तद्भव"],a:0},
{q:"18. जिन शब्दों के खंड सार्थक न हों, उन्हें क्या कहते हैं?",o:["(A) यौगिक","(B) रूढ़","(C) योगरूढ़","(D) इनमें से कोई नहीं"],a:1},
{q:"19. 'विनय' शब्द में उपसर्ग क्या है?",o:["(A) विन","(B) इन","(C) वि","(D) इ"],a:2},
{q:"20. 'वंदना' शब्द में प्रत्यय क्या है?",o:["(A) ना","(B) न","(C) आ","(D) अना"],a:0},
{q:"21. 'मामा' शब्द का विशेषण क्या होगा?",o:["(A) ममेरा","(B) ममिया","(C) ममियारी","(D) इनमें से कोई नहीं"],a:0},
{q:"22. 'यथाशीघ्र' शब्द कौन समास है?",o:["(A) तत्पुरुष","(B) अव्ययीभाव","(C) बहुव्रीहि","(D) द्वंद्व"],a:1},
{q:"23. रचना की दृष्टि से वाक्य के कितने प्रकार हैं?",o:["(A) चार","(B) दो","(C) तीन","(D) पाँच"],a:2},
{q:"24. 'हर तरह के संकटों से घिरे रहने पर भी वह निराश नहीं हुआ' - किस वाक्य का उदाहरण है?",o:["(A) संयुक्त वाक्य","(B) प्रश्नवाचक वाक्य","(C) मिश्र वाक्य","(D) सरल वाक्य"],a:3},
{q:"25. निम्न में से शुद्ध वाक्य कौन है?",o:["(A) यह कहना आपकी गलती है।","(B) शब्द केवल संकेतमात्र हैं।","(C) हमारे शिक्षक प्रश्न पूछते हैं।","(D) चरखा कातना चाहिए।"],a:2},
{q:"26. 'अंतरंग' का विलोम क्या होगा?",o:["(A) अल्प","(B) बहिरंग","(C) अपेक्षा","(D) अनुग्रह"],a:1},
{q:"27. 'जिसके समान द्वितीय नहीं है' - के लिए एक शब्द है:",o:["(A) अजातशत्रु","(B) अनुपम","(C) अद्वितीय","(D) अद्भुत"],a:2},
{q:"28. 'अंगारों पर लोटना' मुहावरे का अर्थ क्या है?",o:["(A) चाल चलना","(B) याचना करना","(C) धोखा देना","(D) ईर्ष्या से व्याकुल होना"],a:3},
{q:"29. 'अश्व' का पर्यायवाची क्या है?",o:["(A) तुरंग","(B) अनल","(C) आमोद","(D) अंबक"],a:0},
{q:"30. 'उसने उस पुस्तकालय को खरीदा, जो उसके मित्र का था' - किस वाक्य का उदाहरण है?",o:["(A) सरल वाक्य","(B) मिश्र वाक्य","(C) संयुक्त वाक्य","(D) इनमें से कोई नहीं"],a:1},
{q:"31. 'अधिनायक' शीर्षक कविता किस कविता संग्रह से ली गई है?",o:["(A) 'सबकुछ होना बचा रहेगा'","(B) 'अतिरिक्त नहीं'","(C) 'लगभग जयहिंद'","(D) 'आत्महत्या के विरुद्ध'"],a:3},
{q:"32. 'एक लेख और एक पत्र' शीर्षक पाठ क्या है?",o:["(A) ऐतिहासिक पत्र","(B) संस्मरण","(C) कहानी","(D) कविता"],a:0},
{q:"33. भगत सिंह के पिता का क्या नाम था?",o:["(A) सरदार विशुन सिंह","(B) सरदार किशन सिंह","(C) सरदार पीरत सिंह","(D) सरदार कीरत सिंह"],a:1},
{q:"34. 'ओ सदानीरा' शीर्षक पाठ के अनुसार, सन् 1962 की बाढ़ का दृश्य जिन्होंने देखा है, उन्हें 'रामचरितमानस' में किसके क्रोध रूपी नदी की बाढ़ याद आई होगी?",o:["(A) लक्ष्मण के","(B) भरत के","(C) कैकेयी के","(D) राम के"],a:2},
{q:"35. 'ओ सदानीरा' पाठ के अनुसार, गाँधीजी ने 'आश्रम विद्यालय' कहाँ स्थापित किया था?",o:["(A) पाटलिपुत्र, नालंदा में","(B) सासाराम, भभुआ में","(C) वैशाली, राजगीर में","(D) बड़हरवा, मधुबन और भितिहरवा में"],a:3},
{q:"36. मोहन राकेश किस आंदोलन के प्रमुख हस्ताक्षर थे?",o:["(A) नई कहानी आंदोलन के","(B) कविता आंदोलन के","(C) स्वाधीनता आंदोलन के","(D) समाज सुधार आंदोलन के"],a:0},
{q:"37. 'सिपाही की माँ' शीर्षक पाठ में, हड्डियों का चलता-फिरता ढाँचा कौन है?",o:["(A) पलटू राम","(B) दीनू कुम्हार","(C) सियाराम मोची","(D) पंडित दीनानाथ"],a:1},
{q:"38. 'आलोचना' त्रैमासिक के प्रधान सम्पादक कौन थे?",o:["(A) बालकृष्ण भट्ट","(B) चंद्रधर शर्मा गुलेरी","(C) नामवर सिंह","(D) जयप्रकाश नारायण"],a:2},
{q:"39. 'प्रगीत और समाज' शीर्षक पाठ के अनुसार, आचार्य रामचंद्र शुक्ल के काव्य-सिद्धांत के आदर्श क्या थे?",o:["(A) भक्तिकाव्य","(B) सूफीकाव्य","(C) गीतिकाव्य","(D) प्रबंधकाव्य"],a:3},
{q:"40. 'जूठन' शीर्षक आत्मकथा में स्कूल के हेडमास्टर का क्या नाम है?",o:["(A) कलीराम","(B) सियाराम","(C) हरिराम","(D) हरेराम"],a:0},
{q:"41. 'सौभाग्य' शब्द का विलोम क्या है?",o:["(A) नभाग्य","(B) दुर्भाग्य","(C) सभाग्य","(D) अभाग्य"],a:1},
{q:"42. 'पत्नी' शब्द का पर्यायवाची क्या है?",o:["(A) सेवक","(B) वारि","(C) अर्धांगिनी","(D) विबुध"],a:2},
{q:"43. 'हमारे जवानों को देखकर दुश्मन भाग गए' - कौन वाक्य है?",o:["(A) मिश्र वाक्य","(B) संयुक्त वाक्य","(C) सरल वाक्य","(D) इनमें से कोई नहीं"],a:2},
{q:"44. 'कहा जा सकता है' - कौन पदबंध है?",o:["(A) संज्ञा पदबंध","(B) विशेषण पदबंध","(C) सर्वनाम पदबंध","(D) क्रिया पदबंध"],a:3},
{q:"45. 'चतुर्भुज' शब्द कौन समास है?",o:["(A) द्विगु","(B) द्वंद्व","(C) तत्पुरुष","(D) अव्ययीभाव"],a:0},
{q:"46. 'विकास' शब्द का विशेषण क्या होगा?",o:["(A) विकारी","(B) विकसित","(C) विकासिती","(D) विकासिन"],a:1},
{q:"47. संज्ञा, सर्वनाम और विशेषण के अंत में लगनेवाले प्रत्यय को क्या कहते हैं?",o:["(A) तद्धित","(B) कृदंत","(C) क्रियाद्योतक कृदंत","(D) वर्तमानकालिक विशेषण"],a:0},
{q:"48. 'य, र, ल, व' - कौन व्यंजन हैं?",o:["(A) स्पर्श व्यंजन","(B) ऊष्म व्यंजन","(C) अंतःस्थ व्यंजन","(D) इनमें से कोई नहीं"],a:2},
{q:"49. हिन्दी में अनुनासिक वर्णों की संख्या कितनी है?",o:["(A) दो","(B) तीन","(C) चार","(D) पाँच"],a:3},
{q:"50. 'दिगंबर' शब्द का संधि-विच्छेद क्या होगा?",o:["(A) दिक् + अंबर","(B) दिगं + बर","(C) दि + गंबर","(D) दिगंब + र"],a:0},

    ];

    const quizContainer = document.getElementById('quiz-container');

    q.forEach((qObj) => {
        const qBox = document.createElement('div');
        qBox.className = 'q-box';
        
        const qText = document.createElement('div');
        qText.className = 'q-text';
        qText.innerHTML = qObj.q;
        qBox.appendChild(qText);
        
        const feedbackBox = document.createElement('div');
        feedbackBox.className = 'feedback';
        
        const btnGroup = document.createElement('div');
    qObj.o.forEach((opt, optIndex) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = opt;
            
            btn.onclick = () => {
                const allBtns = btnGroup.querySelectorAll('.opt-btn');
                allBtns.forEach(b => b.disabled = true);
                
                if (optIndex === qObj.a) {
                    btn.classList.add('correct');
                    feedbackBox.innerHTML = "✅ बिल्कुल सही उत्तर!";
                    feedbackBox.style.color = "#08e446";
                    feedbackBox.style.background = "#e1f5fe";
                    feedbackBox.style.border = "1px solid #0288d1";
                } else {
                    btn.classList.add('incorrect');
                    allBtns[qObj.a].classList.add('correct');
                    
                    const correctText = qObj.o[qObj.a].substring(0,3);
                    feedbackBox.innerHTML = "❌ गलत उत्तर! सही विकल्प: " + correctText + ")";
                    feedbackBox.style.color = "#b71c1c";
                    feedbackBox.style.background = "#ffcdd2";
                    feedbackBox.style.border = "1px solid #d32f2f";
                }
                feedbackBox.style.display = 'block';
            };
            btnGroup.appendChild(btn);
        });
        
        qBox.appendChild(btnGroup);
        qBox.appendChild(feedbackBox);
        quizContainer.appendChild(qBox);
    });
</script>
