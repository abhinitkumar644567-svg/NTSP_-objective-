        { q: "57. मानव शरीर नहीं उत्पन्न करता है—", options: ["(A) एन्जाइम", "(B) DNA", "(C) विटामिन", "(D) हार्मोन्स"], ans: 2 },
        { q: "58. Zn(s) | Zn²⁺(aq) || Cu²⁺(aq) | Cu(s) है—", options: ["(A) वेस्टन सेल", "(B) डेनियल सेल", "(C) कैलोमेल सेल", "(D) इनमें से कोई नहीं"], ans: 1 },
        { q: "59. CH₃CN के अवकरण से प्राप्त होता है—", options: ["(A) CH₄", "(B) CH₃COOH", "(C) C₂H₅NH₂", "(D) C₂H₅COOH"], ans: 2 },
        { q: "60. सबसे प्रबल अम्ल है—", options: ["(A) HClO₄", "(B) HClO₃", "(C) HClO₂", "(D) HClO"], ans: 0 },
        { q: "61. 234.2 ग्राम चीनी के घोल में 34.2 ग्राम चीनी है। घोल का मोलर सान्द्रण क्या होगा?", options: ["(A) 0.1", "(B) 2.0", "(C) 3.0", "(D) 0.5"], ans: 0 },
        { q: "62. निम्न अभिक्रिया का प्रमुख प्रतिफल निम्नलिखित में कौन है?\n CHCl₃ + O₂ ---(प्रकाश)---> ........ + HCl?", options: ["(A) CO₂", "(B) Cl₂", "(C) COCl₂", "(D) इनमें से कोई नहीं"], ans: 2 },
        { q: "63. IUPAC प्रणाली में एसीटोन का नाम है—", options: ["(A) मेथेनल", "(B) एथेनल", "(C) प्रोपेनोन", "(D) एथानोन"], ans: 2 },
        { q: "64. अभिकारक अणुओं को उत्पाद में परिवर्तित होने के लिए आवश्यक न्यूनतम ऊर्जा होती है—", options: ["(A) गतिज ऊर्जा", "(B) स्थितिज ऊर्जा", "(C) सक्रियण ऊर्जा", "(D) गतिज ऊर्जा + स्थितिज ऊर्जा"], ans: 2 },
        { q: "65. भौतिक अधिशोषण में लगभग ऊष्मा उत्सर्जित होती है (kJ/mol) में—", options: ["(A) 20 - 40", "(B) 40 - 60", "(C) 60 - 80", "(D) 40 - 400"], ans: 0 },
        { q: "66. S_N2 क्रियाविधि में निर्माण होता है—", options: ["(A) कार्बा धनायन का", "(B) संक्रमण अवस्था का", "(C) मुक्त मूलक का", "(D) कार्बा ऋणायन का"], ans: 1 },
        { q: "67. निम्न में से कौन-सा यौगिक जल में विलय है?", options: ["(A) CHCl₃", "(B) C₂H₅-O-C₂H₅", "(C) CCl₄", "(D) CH₃CH₂OH"], ans: 3 },
        { q: "68. कार्बोनिल समूह (>C=O) के कार्बन पर कौन-सा प्रसंकरण होता है?", options: ["(A) sp", "(B) sp²", "(C) sp³", "(D) sp³d"], ans: 1 },
        { q: "69. फॉर्मेल्डिहाइड को NaOH के विलयन के साथ गर्म करने पर प्राप्त होता है—", options: ["(A) फार्मिक अम्ल", "(B) एसीटोन", "(C) मेथिल एल्कोहल", "(D) एथिल फार्मेट"], ans: 2 },
        { q: "70. अभिक्रिया C₆H₅N₂⁺Cl⁻ ---(H₃O⁺)---> का उत्पाद है—", options: ["(A) एनीलीन", "(B) फिनॉल", "(C) मिथाइल एल्कोहल", "(D) इनमें से कोई नहीं"], ans: 1 }
    ];

    const quizContainer = document.getElementById('quiz-container');

    questions.forEach((qObj, index) => {
        const qBox = document.createElement('div');
        qBox.className = 'q-box';
        
        const qText = document.createElement('div');
        qText.className = 'q-text';
        qText.innerHTML = qObj.q;
        qBox.appendChild(qText);
        
        const feedbackBox = document.createElement('div');
        feedbackBox.className = 'feedback';
        
        const btnGroup = document.createElement('div');
        
        qObj.options.forEach((opt, optIndex) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = opt;
            
            btn.onclick = () => {
                const allBtns = btnGroup.querySelectorAll('.opt-btn');
                allBtns.forEach(b => b.disabled = true);
                
                if (optIndex === qObj.ans) {
                    btn.classList.add('correct');
                    feedbackBox.innerHTML = "✅ बिल्कुल सही!";
                    feedbackBox.style.color = "#145a32";
                    feedbackBox.style.background = "#d4efdf";
                    feedbackBox.style.border = "1px solid #2ecc71";
                } else {
                    btn.classList.add('incorrect');
                    allBtns[qObj.ans].classList.add('correct');
                    feedbackBox.innerHTML = "❌ गलत उत्तर। सही: " + qObj.options[qObj.ans].substring(0,3) + ")";
                    feedbackBox.style.color = "#93291e";
                    feedbackBox.style.background = "#fdebd0";
                    feedbackBox.style.border = "1px solid #e74c3c";
                }
                feedbackBox.style.display = 'block';
            };
            btnGroup.appendChild(btn);
        });
        
        qBox.appendChild(btnGroup);
        qBox.appendChild(feedbackBox);
        quizContainer.appendChild(qBox);
    });
</script>

</body>
</html>
