<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENGLISH 12th (2025) - 100 Objective Test</title>
    <style>
        /* प्रीमियम और आधुनिक कलर ग्रेडिंग */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        .container {

        h1 {

            font-size: 26px;
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 3px dashed #4f46e5;
            background: linear-gradient(45deg, #312e81, #4f46e5);

            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }
        .info-bar {
            text-align: center;
            font-size: 16px;
            color: #fff;
            background: linear-gradient(to right, #4f46e5, #0ea5e9);
            margin-bottom: 25px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }
        /* --- टाइमर का डिज़ाइन --- */
        .timer-box {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #f43f5e, #fb923c);
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(244, 63, 94, 0.4);
            z-index: 1000;
            letter-spacing: 1px;
            border: 2px solid #fff;
        }
        @media (max-width: 600px) {
            .timer-box {
                top: 10px;
                right: 50%;
                transform: translateX(50%);
                font-size: 16px;
                padding: 10px 20px;
            }
            .container { margin-top: 50px; }
        }
        .q-box {
            margin-bottom: 20px;
            padding: 18px;
            border-left: 5px solid #6366f1;
            border-radius: 8px;
            background: #f8fafc;
            box-shadow: 0 3px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s ease;
        }
        .q-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }
        .q-text {
            font-size: 17px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .opt-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 18px;
            margin-bottom: 8px;
            font-size: 16px;
            background-color: #fff;
            border: 1px solid #cbd5e1;
            color: #334155;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .opt-btn:hover:not(:disabled) {
            background-color: #e0f2fe;
            border-color: #38bdf8;
            transform: translateX(4px);
        }
        .opt-btn:disabled {
            cursor: not-allowed;
            opacity: 0.95;
        }
        .correct {
            background: linear-gradient(to right, #10b981, #34d399) !important;
            border-color: #059669 !important;
            color: #fff !important;
            font-weight: bold;
        }
        .incorrect {
            background: linear-gradient(to right, #ef4444, #f87171) !important;
            border-color: #dc2626 !important;
            color: #fff !important;
            font-weight: bold;
        }
        .feedback {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

    const quizContainer = document.getElementById('quiz-container');

    q.forEach((qObj) => {
        const qBox = document.createElement('div');

        const qText = document.createElement('div');
        qText.className = 'q-text';
        qText.innerHTML = qObj.q;
        qBox.appendChild(qText);
        
        const feedbackBox = document.createElement('div');
        feedbackBox.className = 'feedback';
        
        const btnGroup = document.createElement('div');
        
        qObj.o.forEach((opt, optIndex) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = opt;
            
            btn.onclick = () => {
                const allBtns = btnGroup.querySelectorAll('.opt-btn');
                allBtns.forEach(b => b.disabled = true);
                
                if (optIndex === qObj.a) {
                    btn.classList.add('correct');
                    feedbackBox.innerHTML = "✅ Correct Answer!";
                    feedbackBox.style.color = "#059669";
                    feedbackBox.style.background = "#d1fae5";
                    feedbackBox.style.border = "1px solid #34d399";
                } else {
                    btn.classList.add('incorrect');
                    allBtns[qObj.a].classList.add('correct');
                    
                    const correctText = qObj.o[qObj.a].substring(0,3);
                    feedbackBox.innerHTML = "❌ Wrong Answer! Correct: " + correctText + ")";
                    feedbackBox.style.color = "#dc2626";
                    feedbackBox.style.background = "#fee2e2";
                    feedbackBox.style.border = "1px solid #f87171";
                }
                feedbackBox.style.display = 'block';
            };
            btnGroup.appendChild(btn);

        qBox.appendChild(btnGroup);
        qBox.appendChild(feedbackBox);
        quizContainer.appendChild(qBox);

</script>

</body>
