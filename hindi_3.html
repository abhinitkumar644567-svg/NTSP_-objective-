<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HINDI 12th (2023) - 100 Objective Test</title>
    <style>
        /* आकाशी (Sky Blue) और लाल (Red) का प्रीमियम कॉम्बिनेशन - No White Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #ff7eb3 100%);

            padding: 15px;
            min-height: 100vh;
            color: #4a0000;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #e3f2fd; /* Light Sky Blue */
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(183, 28, 28, 0.3);
            border: 2px solid #ef5350;
        }
        h1 {
            text-align: center;
            font-size: 26px;
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 3px dashed #d32f2f;
            color: #b71c1c;
            font-weight: 900;
        }
        .info-bar {
            text-align: center;
            font-size: 16px;
            color: #e3f2fd;
            background: linear-gradient(to right, #0288d1, #d32f2f);
            margin-bottom: 25px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.4);
        }
        /* --- टाइमर का डिज़ाइन --- */
        .timer-box {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            color: #bbdefb;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;

            z-index: 1000;
            letter-spacing: 1px;
            border: 2px solid #ffcdd2;
        }
        @media (max-width: 600px) {
            .timer-box {
                top: 10px;
                right: 50%;
                transform: translateX(50%);
                font-size: 16px;
                padding: 10px 20px;
            }
            .container { margin-top: 50px; }
        }
        .q-box {
            margin-bottom: 20px;
            padding: 18px;
            border-left: 5px solid #d32f2f;
            border-radius: 8px;
            background: #bbdefb; /* Deeper Sky Blue */
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            transition: transform 0.2s ease;
        }
        .q-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(211, 47, 47, 0.3);
        }
        .q-text {
            font-size: 17px;
            font-weight: bold;
            color: #01579b;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .opt-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 18px;
            margin-bottom: 8px;
            font-size: 16px;
            background-color: #e1f5fe;
            border: 1px solid #0288d1;
            color: #0d47a1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-weight: bold;
        }
        .opt-btn:hover:not(:disabled) {
            background-color: #ffcdd2;
            border-color: #d32f2f;
            color: #b71c1c;
            transform: translateX(4px);
        }
        .opt-btn:disabled {
            cursor: not-allowed;
            opacity: 0.95;
        }

            background: linear-gradient(to right, #0dd102, #80fd90a6) !important;
            border-color: #ff1010 !important;
            color: #e1f5fe !important;
            font-weight: bold;
        }
        .incorrect {
            background: linear-gradient(to right, #d32f2f, #f44336) !important;
            border-color: #b71c1c !important;
            color: #ffebee !important;
            font-weight: bold;
        }

            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div id="timer" class="timer-box">⏱️ 01:00:00</div>

<div class="container">
    <h1>HINDI (हिन्दी) - XII (100 अंक) - 2023 (A)</h1>
    <div class="info-bar">कुल प्रश्न: 100 | समय: 1 घंटा | सही विकल्प चुनें</div>
    <div id="quiz-container"></div>
</div>

<script>
    // 1 Hour Timer
    let timeInSeconds = 3600; 
    const timerElement = document.getElementById('timer');

    const countdown = setInterval(() => {
        if (timeInSeconds <= 0) {
            clearInterval(countdown);
            timerElement.innerHTML = "⏳ Time Up!";
            timerElement.style.background = "linear-gradient(135deg, #b71c1c, #d32f2f)";
            document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
            alert("आपका समय समाप्त हो गया है! अब आप और उत्तर नहीं दे सकते।");
            return;
        }
        timeInSeconds--;
        let h = Math.floor(timeInSeconds / 3600), m = Math.floor((timeInSeconds % 3600) / 60), s = timeInSeconds % 60;
        timerElement.innerHTML = `⏱️ ${h<10?'0'+h:h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
    }, 1000); 

    // Compressed Array of 100 Questions (From Hindi 2023 A Images)
    const q=[
{q:"1. 'मेरा खोया हुआ खिलौना, अब तक मेरे पास न आया !' यह पंक्ति किस शीर्षक कविता से है?",o:["(A) पुत्र-वियोग","(B) प्यारे नन्हें बेटे को","(C) हार-जीत","(D) उषा"],a:0},
{q:"2. 'पंचायती राज में जैसे खो गए पंचपरमेश्वर !' - यह पंक्ति किस शीर्षक कविता से है?",o:["(A) गाँव का घर","(B) अधिनायक","(C) जन-जन का चेहरा एक","(D) हार-जीत"],a:0},
{q:"3. 'जागिए, ब्रजराज कुँवर, कँवल-कुसुम फूले !' - यह पंक्ति किस शीर्षक कविता से है?",o:["(A) सूरदास के पद","(B) तुलसीदास के पद","(C) छप्पय","(D) कवित्त"],a:0},
{q:"4. 'नाम लै भरै उदर एक प्रभु-दासी-दास कहाइ !' - यह पंक्ति किस शीर्षक कविता से है?",o:["(A) कवित्त","(B) छप्पय","(C) तुलसीदास के पद","(D) सूरदास के पद"],a:2},
{q:"5. 'बिशनी' किस एकांकी की पात्रा है?",o:["(A) सिपाही की माँ","(B) पैर तले की जमीन","(C) आधे-अधूरे","(D) आषाढ़ का एक दिन"],a:0},
{q:"6. 'सूबेदारनी' किस कहानी की पात्रा है?",o:["(A) तिरिछ","(B) उसने कहा था","(C) रोज","(D) ओ सदानीरा"],a:1},
{q:"7. 'वजीरासिंह' किस कहानी का पात्र है?",o:["(A) उसने कहा था","(B) रोज","(C) तिरिछ","(D) अर्धनारीश्वर"],a:0},
{q:"8. धाँगड़ों को 18वीं शताब्दी के अंत में किस कार्य के लिए लाया गया था?",o:["(A) नील की खेती के लिए","(B) मखाना की खेती के लिए","(C) मक्का की खेती के लिए","(D) इनमें से कोई नहीं"],a:0},
{q:"9. \"निमोतिया से मरने वालों को मुरब्बे नहीं मिला करते !\"-यह उक्ति किस शीर्षक पाठ से है?",o:["(A) उसने कहा था","(B) शिक्षा","(C) रोज","(D) तिरिछ"],a:0},
{q:"10. \"व्यक्ति से नहीं हमें तो नीतियों से झगड़ा है, सिद्धांतों से झगड़ा है, कार्यों से झगड़ा है।\" - उक्त संभाषण किस समाजवादी लेखक का है?",o:["(A) जयप्रकाश नारायण","(B) नामवर सिंह","(C) भगत सिंह","(D) जे० कृष्णमूर्ति"],a:0},
{q:"11. \"आदमी यथार्थ को जीता ही नहीं, यथार्थ को रचता भी है।\" - यह कथन किस लेखक का है?",o:["(A) मलयज","(B) नामवर सिंह","(C) भगत सिंह","(D) जे० कृष्णमूर्ति"],a:0},
{q:"12. \"जब देश के भाग्य का निर्णय हो रहा हो तो व्यक्तियों के भाग्य को पूर्णतया भुला देना चाहिए।\"-यह उक्ति किस शीर्षक पाठ से है?",o:["(A) एक लेख और एक पत्र","(B) रोज","(C) जूठन","(D) संपूर्ण क्रांति"],a:0},
{q:"13. ओमप्रकाश और सुखदेव सिंह त्यागी किस शीर्षक पाठ के पात्र हैं?",o:["(A) जूठन","(B) ओ सदानीरा","(C) तिरिछ","(D) सिपाही की माँ"],a:0},
{q:"14. गंडक नदी की चर्चा किस शीर्षक पाठ में है?",o:["(A) ओ सदानीरा","(B) रोज","(C) अर्धनारीश्वर","(D) तिरिछ"],a:0},

{q:"16. जे० कृष्णमूर्ति के पिता का नाम क्या था?",o:["(A) नारायण जिद्दू","(B) जे० नारायण","(C) नारायण मूर्ति","(D) प्रेम नारायण सिंह"],a:0},

{q:"21. 'प्रकृति-वर्णन' से संबंधित कविता कौन है?",o:["(A) गाँव का घर","(B) उषा","(C) अधिनायक","(D) छप्पय"],a:1},

    ];

    const quizContainer = document.getElementById('quiz-container');

    q.forEach((qObj) => {
        const qBox = document.createElement('div');
        qBox.className = 'q-box';
        
        const qText = document.createElement('div');
        qText.className = 'q-text';
        qText.innerHTML = qObj.q;
        qBox.appendChild(qText);
        
        const feedbackBox = document.createElement('div');
        feedbackBox.className = 'feedback';
        
        const btnGroup = document.createElement('div');
        
        qObj.o.forEach((opt, optIndex) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = opt;
            
            btn.onclick = () => {
                const allBtns = btnGroup.querySelectorAll('.opt-btn');
                allBtns.forEach(b => b.disabled = true);
                
                if (optIndex === qObj.a) {
                    btn.classList.add('correct');
                    feedbackBox.innerHTML = "✅ बिल्कुल सही उत्तर!";
                    feedbackBox.style.color = "#01579b";
                    feedbackBox.style.background = "#e1f5fe";
                    feedbackBox.style.border = "1px solid #0288d1";
                } else {
                    btn.classList.add('incorrect');
                    allBtns[qObj.a].classList.add('correct');
                    
                    const correctText = qObj.o[qObj.a].substring(0,3);
                    feedbackBox.innerHTML = "❌ गलत उत्तर! सही विकल्प: " + correctText + ")";
                    feedbackBox.style.color = "#b71c1c";
                    feedbackBox.style.background = "#ffcdd2";
                    feedbackBox.style.border = "1px solid #d32f2f";
                }
                feedbackBox.style.display = 'block';
            };
            btnGroup.appendChild(btn);
        });
        
        qBox.appendChild(btnGroup);
        qBox.appendChild(feedbackBox);
        quizContainer.appendChild(qBox);
    });
</script>
