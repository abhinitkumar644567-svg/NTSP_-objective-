<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHYSICS 12th (2027) - 70 Objective Test</title>
    <style>
        /* शाही नीला (Royal Blue) और आकाशी (Sky Blue) का प्रीमियम कॉम्बिनेशन - No White Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d47a1 0%, #42a5f5 100%);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            color: #002171;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #e3f2fd; /* Light Sky Blue */
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(13, 71, 161, 0.4);
            border: 2px solid #1976d2;
        }
        h1 {
            text-align: center;
            font-size: 26px;
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 3px dashed #1565c0;
            color: #0d47a1;
            font-weight: 900;
        }
        .info-bar {
            text-align: center;
            font-size: 16px;
            color: #e3f2fd;
            background: linear-gradient(to right, #0d47a1, #1976d2);
            margin-bottom: 25px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(13, 71, 161, 0.3);
        }
        /* --- टाइमर का डिज़ाइन --- */
        .timer-box {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: #bbdefb;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(13, 71, 161, 0.5);
            z-index: 1000;
            letter-spacing: 1px;
            border: 2px solid #90caf9;
        }
        @media (max-width: 600px) {
            .timer-box {
                top: 10px;
                right: 50%;
                transform: translateX(50%);
                font-size: 16px;
                padding: 10px 20px;
            }
            .container { margin-top: 50px; }
        }
        .q-box {
            margin-bottom: 20px;
            padding: 18px;
            border-left: 5px solid #1565c0;
            border-radius: 8px;
            background: #bbdefb; /* Deeper Sky Blue */
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            transition: transform 0.2s ease;
        }
        .q-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(13, 71, 161, 0.3);
        }
        .q-text {
            font-size: 17px;
            font-weight: bold;
            color: #0d47a1;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .opt-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 18px;
            margin-bottom: 8px;
            font-size: 16px;
            background-color: #e1f5fe;
            border: 1px solid #42a5f5;
            color: #0d47a1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-weight: bold;
        }
        .opt-btn:hover:not(:disabled) {
            background-color: #90caf9;
            border-color: #0d47a1;
            color: #000;
            transform: translateX(4px);
        }
        .opt-btn:disabled {
            cursor: not-allowed;
            opacity: 0.95;
        }
        .correct {
            background: linear-gradient(to right, #2e7d32, #43a047) !important;
            border-color: #1b5e20 !important;
            color: #e8f5e9 !important;
            font-weight: bold;
        }
        .incorrect {
            background: linear-gradient(to right, #c62828, #e53935) !important;
            border-color: #b71c1c !important;
            color: #ffebee !important;
            font-weight: bold;
        }
        .feedback {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div id="timer" class="timer-box">⏱️ 01:00:00</div>

<div class="container">
    <h1>PHYSICS (भौतिकी) - XII, 2027 (A)</h1>
    <div class="info-bar">कुल प्रश्न: 70 | समय: 1 घंटा | सही विकल्प चुनें</div>
    <div id="quiz-container"></div>
</div>

<script>
    // 1 Hour Timer
    let timeInSeconds = 3600; 
    const timerElement = document.getElementById('timer');

    const countdown = setInterval(() => {
        if (timeInSeconds <= 0) {
            clearInterval(countdown);
            timerElement.innerHTML = "⏳ Time Up!";
            timerElement.style.background = "linear-gradient(135deg, #b71c1c, #d32f2f)";
            document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
            alert("आपका समय समाप्त हो गया है! अब आप और उत्तर नहीं दे सकते।");
            return;
        }
        timeInSeconds--;
        let h = Math.floor(timeInSeconds / 3600), m = Math.floor((timeInSeconds % 3600) / 60), s = timeInSeconds % 60;
        timerElement.innerHTML = `⏱️ ${h<10?'0'+h:h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
    }, 1000); 

    // Compressed Array of 70 Questions (From Physics 2027 Model Paper Images)
    const q=[
{q:"1. दो आवेशों के बीच की दूरी आधी कर दी जाती है तथा एक आवेश को भी आधा कर दिया जाता है। दोनों के बीच लगने वाला बल, पहले की अपेक्षा हो जाएगा :",o:["(A) आधा","(B) दुगुना","(C) तिगुना","(D) इनमें से कोई नहीं"],a:1},
{q:"2. 'r' दूरी पर रखे दो वैद्युत द्विध्रुवों से बने निकाय की वैद्युत स्थितिज ऊर्जा अनुक्रमानुपाती होती है :",o:["(A) r² के","(B) r⁻³ के","(C) r⁴ के","(D) इनमें से कोई नहीं"],a:1},
{q:"3. वैद्युत चालन में चालक से मुक्त इलेक्ट्रॉनों का अपवाह वेग v एवं चालक के सिरों के बीच लगे विभवान्तर V के बीच सम्बन्ध है :",o:["(A) V के अनुक्रमानुपाती","(B) V के व्युत्क्रमानुपाती","(C) V² के अनुक्रमानुपाती","(D) V² के व्युत्क्रमानुपाती"],a:0},
{q:"4. लौह चुम्बकीय पदार्थ के लिए आपेक्षिक चुम्बकशीलता (&mu;ᵣ) का मान होता है :",o:["(A) &mu;ᵣ < 1","(B) &mu;ᵣ = 1","(C) &mu;ᵣ > 1","(D) &mu;ᵣ >> 1"],a:3},
{q:"5. निम्न में से कौन-सा नियम ऊर्जा संरक्षण के सिद्धान्त पर आधारित है?",o:["(A) एम्पीयर का नियम","(B) फैराडे का विधुत-अपघटन नियम","(C) लेज का नियम","(D) इनमें से कोई नहीं"],a:2},
{q:"6. अनुनाद की स्थिति में L-C परिपथ की आवृत्ति होती है :",o:["(A) 1 / (2&pi;&radic;LC)","(B) 2&pi; / &radic;LC","(C) 1 / (&radic;LC)","(D) 2&pi;&radic;LC / &pi;"],a:0},
{q:"7. निम्नलिखित में कौन-सी वैद्युत चुंबकीय तरंग नहीं है?",o:["(A) अल्फा किरणें","(B) गामा किरणें","(C) अवरक्त किरणें","(D) एक्स किरणें"],a:0},
{q:"8. एक उत्तल लेंस की क्षमता 2 डायोप्टर है। इसकी फोकस दूरी होगी :",o:["(A) 20 सेमी","(B) 50 सेमी","(C) 40 सेमी","(D) 60 सेमी"],a:1},
{q:"9. निम्नलिखित में किसे ध्रुवीकृत नहीं किया जा सकता है?",o:["(A) ध्वनि तरंगें","(B) प्रकाश तरंगें","(C) रेडियो तरंगें","(D) एक्स-रे"],a:0},
{q:"10. किसी गतिमान कण से सम्बद्ध डी ब्रॉग्ली तरंग की तरंगदैर्ध्य निर्भर नहीं करती है :",o:["(A) द्रव्यमान पर","(B) आवेश पर","(C) वेग पर","(D) संवेग पर"],a:1},
{q:"11. एक इलेक्ट्रॉन 5 वोल्ट विभवान्तर तक त्वरित किया जाता है। इलेक्ट्रॉन द्वारा अर्जित ऊर्जा होगी :",o:["(A) 5 जूल","(B) 5 इलेक्ट्रॉन-वोल्ट","(C) 5 erg","(D) 5 वाट"],a:1},
{q:"12. अर्द्धचालक में वर्जित ऊर्जा अंतराल की चौड़ाई लगभग होती है :",o:["(A) 1 eV","(B) 10 eV","(C) 100 eV","(D) 0.01 eV"],a:0},
{q:"13. संचार उपग्रह की पृथ्वी की सतह से दूरी है :",o:["(A) 36000 किमी","(B) 36000 मील","(C) 3600 किमी","(D) 36000 मीटर"],a:0},
{q:"14. धातु के आवेशित गोले के पृष्ठ से गोले के केंद्र की ओर जाने पर वैद्युत क्षेत्र :",o:["(A) घटता है","(B) बढ़ता है","(C) उतना ही रहता है जितना पृष्ठ पर है","(D) सर्वत्र शून्य रहता है"],a:3},
{q:"15. किसी संधारित्र की धारिता निर्भर नहीं करती है :",o:["(A) प्लेटों की आकृति पर","(B) प्लेटों के आकार पर","(C) प्लेटों के आवेश पर","(D) प्लेटों के बीच अंतराल पर"],a:2},
{q:"16. दशमलव अंक पद्धति की संख्या 27 की द्विआधारी पद्धति में समतुल्य संख्या होगी :",o:["(A) (10011)₂","(B) (10111)₂","(C) (11001)₂","(D) (11011)₂"],a:1},
{q:"17. दो विद्युत् आवेशों के बीच लगनेवाले बल को नियंत्रित करनेवाला नियम :",o:["(A) एम्पीयर का नियम","(B) ओह्म का नियम","(C) फैराडे का नियम","(D) कूलॉम का नियम"],a:3},
{q:"18. X-किरणें हैं :",o:["(A) गतिमान इलेक्ट्रॉन","(B) गतिमान ऋणात्मक आयन","(C) गतिमान धनात्मक आयन","(D) विद्युत् चुंबकीय तरंगें"],a:3},
{q:"19. प्रकाश वर्ष का मान बराबर होता है :",o:["(A) 9.46 × 10¹⁵ m","(B) 9.46 × 10¹² m","(C) 9.46 × 10¹⁰ m","(D) 9.46 × 10¹¹ m"],a:0},
{q:"20. लेजर किया के लिए आवश्यक है :",o:["(A) उच्च ताप","(B) अर्द्धचालक","(C) संख्या परिवर्तन","(D) उच्च दाब"],a:2},
{q:"21. किसी परमाणु का नाभिक बना होता है :",o:["(A) प्रोटॉन से","(B) प्रोटॉन एवं इलेक्ट्रॉन से","(C) प्रोटॉन और न्यूट्रॉन से","(D) अल्फा कण से"],a:2},
{q:"22. परावैद्युतांक का S.I. मात्रक होता है :",o:["(A) N⁻¹C⁻¹m⁻²","(B) NC⁻²m²","(C) N⁻¹C²m⁻²","(D) C²N⁻¹m⁻²"],a:3},
{q:"23. जब किसी एमीटर को शंट किया जाता है, तब परिपथ का कुल प्रतिरोध :",o:["(A) बढ़ता है","(B) घटता है","(C) स्थिर रहता है","(D) इनमें से कोई नहीं"],a:1},
{q:"24. किसी अर्द्धचालक का तापमान गुणांक का मान होता है :",o:["(A) धनात्मक","(B) ऋणात्मक","(C) शून्ये","(D) अनंत"],a:1},
{q:"25. किसी माध्यम की आपेक्षिक परावैद्युतता (&epsilon;ᵣ) होती है :",o:["(A) &epsilon; / &epsilon;₀","(B) &epsilon; × &epsilon;₀","(C) &epsilon; + &epsilon;₀","(D) &epsilon; - &epsilon;₀"],a:0},
{q:"26. आवेश का विमा होता है :",o:["(A) AT","(B) A⁻¹T","(C) A⁻¹T","(D) AT²"],a:0},
{q:"27. स्थिर विद्युत् क्षेत्र होता है :",o:["(A) संरक्षी","(B) असंरक्षी","(C) कहीं संरक्षी कहीं असंरक्षी","(D) इनमें से कोई नहीं"],a:0},
{q:"28. विधुत द्वि-ध्रुव आघूर्ण का S.I. मात्रक होता है :",o:["(A) कूलॉम × मी. (C × m)","(B) कूलॉम × मी² (C × m²)","(C) कूलॉम / मी (C / m)","(D) कूलॉम / मी² (C / m²)"],a:0},
{q:"29. एक फैराड (F) बराबर होता है :",o:["(A) 1 C V⁻¹","(B) 1 C V","(C) 1 C V⁻²","(D) 1 C V²"],a:0},
{q:"30. विधुत धारिता का मात्रक होता है :",o:["(A) वोल्ट","(B) न्यूटन","(C) फैarad (फैरड)","(D) एम्पीयर"],a:2},
{q:"31. कार्बन प्रतिरोध के हरे रंग के कूट का मान है :",o:["(A) 3","(B) 4","(C) 5","(D) 6"],a:2},
{q:"32. किसी चालक का विशिष्ट प्रतिरोध बढ़ता है :",o:["(A) तापमान बढ़ने से","(B) अनुप्रस्थ काट क्षेत्रफल घटने से","(C) लम्बाई घटने से","(D) अनुप्रस्थ काट क्षेत्रफल बढ़ने से"],a:0},
{q:"33. विद्युत् हीटर में जिस तत्त्व का व्यवहार किया जाता है, वह है :",o:["(A) ताँबा","(B) नाइक्रोम","(C) टंगस्टन","(D) प्लेटिनम"],a:1},
{q:"34. सेल का वि. वा. ब. मापा जा सकता है :",o:["(A) वोल्टमीटर द्वारा","(B) धारामापी (अमीटर) द्वारा","(C) पोटेंशियोमीटर (विभवमापी) द्वारा","(D) विषयमापी द्वारा"],a:2},
{q:"35. डायनेमो के कार्य का सिद्धान्त आधारित है :",o:["(A) धारा के ऊष्मीय प्रभाव पर","(B) विद्युत् चुम्बकीय प्रेरण पर","(C) विद्युतीय प्रेरण पर","(D) विधुतमय धारा."],a:1},
{q:"36. चुम्बकीय क्षेत्र B में अवस्थित (M) चुम्बकीय आघूर्ण वाले चुम्बक पर लगने वाले बल-आघूर्ण (&tau;) का मान होता है :",o:["(A) &tau; = M × B","(B) &tau; = B × M","(C) &tau; = M . B","(D) &tau; = M / B"],a:0},
{q:"37. चुम्बकीय क्षेत्र B में V वेग से गतिशील आवेश (q) पर लगने वाले बल का व्यंजक है :",o:["(A) F&arrow; = q(V&arrow; × B&arrow;)","(B) F&arrow; = q(B&arrow; × V&arrow;)","(C) F&arrow; = q / (B&arrow; × V&arrow;)","(D) F&arrow; = (V&arrow; × B&arrow;) / q"],a:0},
{q:"38. लोहा होता है :",o:["(A) अनुचुम्बकीय","(B) प्रतिचुम्बकीय","(C) लौह चुम्बकीय","(D) अर्द्धचालक"],a:2},
{q:"39. चुम्बकीय आघूर्ण बढ़ाने से दोलन करते चुम्बक का आवर्तकाल :",o:["(A) बढ़ता है","(B) घटता है","(C) नहीं बदलता है","(D) इनमें से कोई नहीं"],a:1},
{q:"40. चुम्बकीय विषुवत रेखा पर नमन कोण का मान होता है :",o:["(A) 0°","(B) 45°","(C) 60°","(D) 90°"],a:0},
{q:"41. निकेल है :",o:["(A) अनुचुम्बकीय","(B) प्रतिचुम्बकीय","(C) लौहचुम्बकीय","(D) इनमें से कोई नहीं"],a:2},
{q:"42. पृथ्वी के चुम्बकीय ध्रुवों पर नमन कोण (नमन कोण) होता है :",o:["(A) 0°","(B) 45°","(C) 60°","(D) 90°"],a:3},
{q:"43. लेन्ज का नियम पालन करता है :",o:["(A) बायो-सावर्ट नियम का","(B) संवेग संरक्षण का सिद्धांत","(C) ऊर्जा संरक्षण का सिद्धान्त","(D) आवेश संरक्षण का सिद्धांत"],a:2},
{q:"44. स्व-प्रेरकत्व का S.I. मात्रक है :",o:["(A) कूलॉम","(B) वोल्ट","(C) ओम","(D) हेनरी"],a:3},
{q:"45. हेनरी मात्रक होता है :",o:["(A) स्वप्रेरकत्व","(B) प्रेरकत्व","(C) प्रतिरोध","(D) कोई नहीं"],a:1},
{q:"46. गैल्वेनोमीटर को वोल्टमीटर बनाने में जरूरत है :",o:["(A) उच्च प्रतिरोध का","(B) निम्न प्रतिरोध का","(C) शंट का","(D) प्रतिरोध"],a:0},

{q:"70. उत्सर्जित फोटो इलेक्ट्रॉन की ऊर्जा जितनी निर्भर करती है वह है :",o:["(A) प्रकाश की तीव्रता पर","(B) प्रकाश के तरंगदैर्ध्य पर","(C) धातु के कार्य फलन पर","(D) इनमें से कोई नहीं"],a:1}
    ];

    const quizContainer = document.getElementById('quiz-container');

    q.forEach((qObj) => {
        const qBox = document.createElement('div');
        qBox.className = 'q-box';
        
        const qText = document.createElement('div');
        qText.className = 'q-text';
        qText.innerHTML = qObj.q;
        qBox.appendChild(qText);
        
        const feedbackBox = document.createElement('div');
        feedbackBox.className = 'feedback';
        
        const btnGroup = document.createElement('div');
        
        qObj.o.forEach((opt, optIndex) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = opt;
            
            btn.onclick = () => {
                const allBtns = btnGroup.querySelectorAll('.opt-btn');
                allBtns.forEach(b => b.disabled = true);
                
                if (optIndex === qObj.a) {
                    btn.classList.add('correct');
                    feedbackBox.innerHTML = "✅ बिल्कुल सही उत्तर!";
                    feedbackBox.style.color = "#1b5e20";
                    feedbackBox.style.background = "#e8f5e9";
                    feedbackBox.style.border = "1px solid #43a047";
                } else {
                    btn.classList.add('incorrect');
                    allBtns[qObj.a].classList.add('correct');
                    
                    const correctText = qObj.o[qObj.a].substring(0,3);
                    feedbackBox.innerHTML = "❌ गलत उत्तर! सही विकल्प: " + correctText + ")";
                    feedbackBox.style.color = "#b71c1c";
                    feedbackBox.style.background = "#ffebee";
                    feedbackBox.style.border = "1px solid #e53935";
                }
                feedbackBox.style.display = 'block';
            };
            btnGroup.appendChild(btn);
        });
        
        qBox.appendChild(btnGroup);
        qBox.appendChild(feedbackBox);
        quizContainer.appendChild(qBox);
    });
</script>

</html>
